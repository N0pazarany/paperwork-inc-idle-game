<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paperwork Inc.</title>
<!-- Единственная внешняя зависимость: SDK Telegram Mini Apps -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   ДИЗАЙН v1.4: «казённый офис»
   Стены — бледно-серо-зелёные, вкладки и содержимое — манильская
   папка, карточки — листы бумаги, кнопки — чернила копирки,
   акценты — красная печать. В Telegram цвета берутся из темы.
   Шрифты: IBM Plex Sans (текст) и IBM Plex Mono (цифры, номера форм)
   встроены в конец <head>, внешних загрузок нет.
   ============================================================ */
:root{
  --bg: var(--tg-theme-secondary-bg-color, #d9ded3);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fbfaf6));
  --text: var(--tg-theme-text-color, #1e2226);
  --hint: var(--tg-theme-hint-color, #676d64);
  --accent: var(--tg-theme-button-color, #2c4a8a);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, #2c4a8a);
  --ink: var(--tg-theme-destructive-text-color, #b5312a);
  /* папка: в Telegram — фон, слегка подкрашенный цветом кнопок темы */
  --folder: var(--card);
  --tab-idle: var(--bg);
  --line: rgba(127,127,127,.22);
  --line-strong: rgba(127,127,127,.42);
  --edge: rgba(0,0,0,.07);
  --chip: rgba(127,127,127,.14);
  --sans: "Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --mini-h: 50px;
  /* в полноэкранном режиме Telegram кладёт свои кнопки поверх страницы — отступаем от них.
     Переменные выставляет telegram-web-app.js; вне полноэкранного режима они равны 0 */
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
}
@supports (color: color-mix(in srgb, red, blue)) {
  :root{
    --folder: color-mix(in srgb, var(--bg) 84%, var(--accent));
    --tab-idle: color-mix(in srgb, var(--bg) 93%, var(--accent));
    --chip: color-mix(in srgb, var(--text) 9%, transparent);
  }
}
/* Вне Telegram — собственная палитра (светлая и тёмная) */
html.no-tg{
  --bg:#d9ded3; --card:#fbfaf6; --text:#1e2226; --hint:#676d64;
  --accent:#2c4a8a; --accent-text:#fff; --link:#2c4a8a; --ink:#b5312a;
  --folder:#e9d7a6; --tab-idle:#d6d2b8; --edge:rgba(80,60,10,.14);
}
@media (prefers-color-scheme: dark){
  html.no-tg{
    --bg:#181b19; --card:#25282b; --text:#e8e6df; --hint:#8c9189;
    --accent:#5b7fcf; --accent-text:#fff; --link:#8eabea; --ink:#e2574c;
    --folder:#383226; --tab-idle:#272824; --edge:rgba(0,0,0,.35);
  }
}
/* Тема, выбранная в настройках, важнее и Telegram, и системы */
html.theme-light{
  --bg:#d9ded3; --card:#fbfaf6; --text:#1e2226; --hint:#676d64;
  --accent:#2c4a8a; --accent-text:#fff; --link:#2c4a8a; --ink:#b5312a;
  --folder:#e9d7a6; --tab-idle:#d6d2b8; --edge:rgba(80,60,10,.14);
}
html.theme-dark{
  --bg:#181b19; --card:#25282b; --text:#e8e6df; --hint:#8c9189;
  --accent:#5b7fcf; --accent-text:#fff; --link:#8eabea; --ink:#e2574c;
  --folder:#383226; --tab-idle:#272824; --edge:rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Прокручивается не сама страница, а контейнер .scroller внутри неё.
   Так игра листается везде: и в Telegram, и во встроенной рамке itch.io,
   даже если рамке запрещена прокрутка (scrolling="no"). */
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font:400 15px/1.45 var(--sans);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased;
}
.scroller{
  position:fixed; inset:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain; scrollbar-width:thin;
}
/* Скроллбары в цвет темы, а не белые */
.scroller,.sheet{scrollbar-color:var(--line-strong) transparent}
.scroller::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:8px}
.scroller::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
.scroller::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{color:var(--hint)}
.wrap{max-width:520px;margin:0 auto;padding:calc(12px + var(--safe-top)) 12px calc(28px + env(safe-area-inset-bottom))}
/* Настройка «Анимации печатей: выкл» */
html.no-anim *, html.no-anim *::before, html.no-anim *::after{animation:none!important;transition:none!important}
html.no-anim .stamp-anim, html.no-anim .float-num{display:none}
@media (prefers-reduced-motion: reduce){ .mini, .tabs{transition:none!important} }

/* ---------- Шапка: баланс прямо на «стене», без рамки ---------- */
.hdr{padding:4px 4px 0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.docs-label{font-size:13.5px;color:var(--hint)}
.docs-label::first-letter{text-transform:uppercase}
.icons{display:flex;gap:6px;flex:none}
.icon-btn{
  position:relative;
  width:38px; height:38px; border:0; border-radius:10px; padding:0;
  background:var(--chip); color:var(--text); display:grid; place-items:center;
}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
/* красная точка: в справочнике есть непрочитанный раздел */
.icon-btn.dot::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.docs{font:700 46px/1.05 var(--mono);letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.rate{font:500 15px var(--mono);color:var(--link);margin-top:2px}
.subres{display:flex;gap:4px 16px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.subres b{font-family:var(--mono);font-weight:700}
.sign{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; padding:13px;
  border-radius:8px; border:0; background:var(--accent); color:var(--accent-text); font-weight:600; font-size:16px; position:relative;
}
.sign .mono{font-weight:500;opacity:.8}
.sign:active{transform:scale(.98)}
.sign.minor{
  width:auto; display:inline-flex; margin:10px 0 0; padding:6px 12px; font-size:13px; font-weight:500;
  background:transparent; color:var(--hint); border:1px dashed var(--line-strong);
}
.float-num{
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  font:700 14px var(--mono); color:var(--ink); pointer-events:none; animation:floatUp .8s ease-out forwards;
}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}

/* ---------- Мини-баланс: появляется сверху, когда шапка ушла за экран ---------- */
.mini{
  position:fixed; top:0; left:0; right:0; z-index:15; height:calc(var(--mini-h) + var(--safe-top)); padding-top:var(--safe-top);
  background:var(--bg); transform:translateY(-102%); transition:transform .18s ease-out;
}
.mini-in{max-width:520px;height:100%;margin:0 auto;padding:0 12px 0 16px;display:flex;align-items:center;gap:10px}
.mini-num{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;overflow:hidden;white-space:nowrap}
.mini-main{display:flex;align-items:baseline;gap:8px;min-width:0}
.mini-sub{display:flex;gap:14px;font:400 12px/1.25 var(--mono);color:var(--hint);margin-top:1px}
.mini-sub b{font-weight:700;color:var(--text)}
.mini-sub [hidden]{display:none}
.mini.two .mini-docs{font-size:19px;line-height:1.1}
.mini-docs{font:700 21px var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini-rate{font:500 12.5px var(--mono);color:var(--link)}
.mini .icon-btn{width:34px;height:34px}
body.mini-on .mini{transform:none}

/* ---------- Строка служебной записки ---------- */
.memo{margin:12px 4px 0;font:400 12.5px/1.4 var(--mono);color:var(--hint);min-height:35px;transition:opacity .4s}
.memo.fade{opacity:0}

/* ---------- Папка: вкладки + содержимое — одно целое ---------- */
.tabs{
  position:sticky; top:var(--safe-top); z-index:5; display:flex; gap:4px; padding-top:8px; margin-top:8px;
  background:var(--bg); transition:top .18s ease-out;
  box-shadow:0 8px 0 var(--folder);            /* полоса папки под вкладками: карточки уезжают под неё */
}
body.mini-on .tabs{top:calc(var(--mini-h) + var(--safe-top))}
.tab{
  flex:1 1 auto; min-width:0; border:0; border-radius:10px 10px 0 0;
  background:var(--tab-idle); color:var(--hint); padding:10px 8px 9px;
  font:600 13.5px var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tab.active{background:var(--folder);color:var(--text)}
.tab:disabled{opacity:.55;cursor:default}
.t-ico:empty{display:none}
/* узкие экраны: четыре кнопки в шапке и строка «Заявка» помещаются */
.docs-label{min-width:0;overflow-wrap:anywhere}
.po button{white-space:nowrap}
@media (max-width:359px){
  .icons{gap:5px}
  .icon-btn,.mini .icon-btn{width:34px;height:34px}
  .mini-in{gap:6px;padding:0 8px 0 12px}
  .po{gap:4px;font-size:12px}
  .po button{padding:5px 7px}
  .tabs{gap:3px}
  .tab{padding:9px 4px 8px;font-size:12px;letter-spacing:-.01em}
  .tab .badge{margin-left:3px}
}
.badge{
  display:inline-block; min-width:18px; height:18px; padding:0 5px; margin-left:5px; border-radius:9px;
  background:var(--ink); color:#fff; font:700 11px/18px var(--mono); vertical-align:1px;
}
.panel{display:none;background:var(--folder);border-radius:0 0 12px 12px;padding:16px 10px 6px}
.panel.active{display:block}

/* ---------- Листы (карточки) ---------- */
.card{
  background:var(--card); border-radius:4px; padding:12px 12px 12px 18px; margin-bottom:8px;
  position:relative; overflow:hidden; box-shadow:0 1px 0 var(--edge), 0 0 0 1px var(--edge);
}
.card::before{content:"";position:absolute;top:0;bottom:0;left:9px;width:1px;background:var(--ink);opacity:.28}
.c-head{display:flex;align-items:center;gap:10px}
.c-emoji{font-size:26px;width:34px;text-align:center;flex:none}
.c-title{flex:1;min-width:0}
.c-name{font-weight:600;font-size:15.5px;line-height:1.25}
.c-form{font:400 11.5px var(--mono);color:var(--hint);margin-top:2px}
.c-owned{font:700 22px var(--mono)}
.c-desc{font-size:13px;line-height:1.45;color:var(--hint);margin:8px 0}
.c-stats{font:500 12px var(--mono);margin-bottom:8px}
.effect{font:500 12px/1.45 var(--mono);color:var(--link);margin-bottom:10px}
.ms{display:flex;align-items:center;gap:8px;font:400 11.5px var(--mono);color:var(--hint);margin-bottom:10px}
.ms-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:flex}
.ms-bar i{display:block;flex:none;height:100%;width:0;background:var(--link);transition:width .25s}
.ms-bar i.ghost{opacity:.55}   /* сколько добавит покупка в режимах ×10, До ×2 и MAX */

.btn{
  display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%;
  border:1px solid transparent; border-radius:6px; padding:11px 12px;
  background:var(--accent); color:var(--accent-text); font-weight:600; font-size:14px; text-align:left;
  touch-action:manipulation;
}
.btn .sub{font:500 13px var(--mono);white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{background:transparent;color:var(--hint);border:1px dashed var(--line-strong);cursor:default}
.btn.danger{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong)}
.btn.holding{box-shadow:inset 0 0 0 2px var(--accent-text)}

.redacted .c-name .rbar{background:var(--text);color:transparent;border-radius:2px;padding:0 4px}
.redacted{opacity:.7}

/* Печать «APPROVED» при покупке */
.stamp-anim{
  position:absolute; right:14px; top:12px; border:3px solid var(--ink); color:var(--ink);
  font:700 13px var(--mono); padding:2px 8px; border-radius:4px; letter-spacing:.1em;
  pointer-events:none; animation:stampIn 1s ease-out forwards;
}
@keyframes stampIn{
  0%{transform:rotate(-12deg) scale(2.3);opacity:0}
  18%{transform:rotate(-12deg) scale(1);opacity:.95}
  70%{opacity:.85}
  100%{transform:rotate(-12deg) scale(1);opacity:0}
}

/* Количество покупки */
.po{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hint);margin:0 2px 12px}
.po .sp{flex:1}
.po button{
  border:0; background:var(--chip); border-radius:6px;
  padding:5px 10px; font:500 12.5px var(--mono); color:var(--text);
}
.po button.on{background:var(--text);color:var(--card)}

.empty{text-align:center;color:var(--hint);font-size:13.5px;padding:24px 10px}
details.filed{margin:4px 0 8px}
details.filed summary{font-size:13px;font-weight:600;color:var(--hint);padding:8px 4px;cursor:pointer}
.filed-row{font-size:13.5px;padding:7px 4px;border-bottom:1px dashed var(--line)}
.filed-row .mono{font-size:11.5px;color:var(--link)}
.filed-row .mono.lvl{color:var(--hint)}

/* Реорганизация */
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv b{font:600 13px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.big-gain{font:700 30px var(--mono);color:var(--ink);text-align:center;margin:12px 0 2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--ink);width:0}
.section-title{font-size:13.5px;font-weight:600;color:var(--hint);margin:18px 4px 8px}
.card .section-title{margin:16px 0 6px}
.shop-head{font-size:15px;margin-bottom:4px}
.shop-head b{font:700 20px var(--mono)}
.perk-auto{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:-2px 0 10px}

/* ---------- Модальное окно ---------- */
.overlay{
  position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5);
  display:none; align-items:flex-end; justify-content:center; padding:12px;
}
.overlay.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%; max-width:480px; max-height:88vh; overflow:auto; background:var(--card); color:var(--text);
  border-radius:12px; padding:20px 18px calc(16px + env(safe-area-inset-bottom)); position:relative;
  animation:slideUp .25s ease-out; overscroll-behavior:contain;
}
@keyframes slideUp{from{transform:translateY(30px)}to{transform:none}}
.sheet .m-form{font:400 12px var(--mono);color:var(--hint)}
.sheet h2{margin:4px 0 12px;font-size:21px;font-weight:600;line-height:1.25}
.sheet.stamped .m-form,.sheet.stamped h2{padding-right:118px}
.sheet .m-body{font-size:15px}
.sheet .m-body p{margin:0 0 10px}
.sheet .m-joke{color:var(--hint);border-left:2px solid var(--ink);padding:2px 0 2px 10px;margin:12px 0}
.sheet .m-stamp{
  position:absolute; right:16px; top:18px; transform:rotate(10deg);
  border:3px solid var(--ink); color:var(--ink); padding:3px 9px; border-radius:4px;
  font:700 13px var(--mono); letter-spacing:.1em; opacity:.85;
}
.m-btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.m-btns .btn{justify-content:center}
textarea.code{
  width:100%; height:110px; resize:none; font:400 11px/1.35 var(--mono); word-break:break-all;
  background:var(--bg); color:var(--text); border:1px solid var(--line-strong); border-radius:6px; padding:8px;
  -webkit-user-select:text; user-select:text;
}

/* ---------- Настройки ---------- */
.set-sec{font-size:13px;font-weight:600;color:var(--hint);margin:18px 0 2px}
.set-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.set-label small{display:block;font-size:12px;color:var(--hint)}
.switch{
  width:46px; height:26px; border-radius:13px; border:0; padding:0; flex:none;
  background:var(--line-strong); position:relative; transition:background .15s;
}
.switch::after{
  content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;
}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.seg{display:flex;background:var(--chip);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;color:var(--hint);border-radius:5px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input.vol{width:150px;accent-color:var(--accent)}
input.vol:disabled{opacity:.4}
.btn-row{display:flex;gap:8px}
.btn-row .btn{justify-content:center;font-size:13.5px}
.credit{text-align:center;font:400 11.5px/1.7 var(--mono);color:var(--hint);margin-top:18px}
.credit a{color:var(--link);text-decoration:none}

/* ---------- Достижения ---------- */
textarea.code.share{font:400 13px/1.45 var(--sans);height:150px;word-break:normal}
.ach-sum{font:500 12.5px var(--mono);color:var(--hint);margin:-4px 0 10px}
.ach .rbar{background:var(--hint);color:transparent;border-radius:2px;opacity:.5}
/* личное дело: строка отдела с долей дохода */
.st-dept{display:grid;grid-template-columns:1fr auto 44px;gap:2px 10px;align-items:baseline;padding:7px 0 6px;border-bottom:1px dashed var(--line);font-size:13.5px}
.st-dept .sd-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-dept b{font-size:13px;font-weight:600} .st-dept .sd-p{text-align:right;color:var(--hint);font-size:12.5px}
.sd-bar{grid-column:1 / -1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.sd-bar i{display:block;height:100%;background:var(--link)}
.ach{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ach .ae{font-size:22px;width:30px;text-align:center;flex:none}
.ach .an{font-weight:600;font-size:14.5px}
.ach .ad{font-size:12.5px;color:var(--hint)}
.ach.locked .ae{filter:grayscale(1);opacity:.35}
.ach.locked .an{color:var(--hint)}
.ach .ok{margin-left:auto;color:var(--ink);font:700 11px var(--mono);letter-spacing:.06em;border:2px solid var(--ink);border-radius:3px;padding:1px 5px;transform:rotate(-8deg);flex:none}

/* ---------- Директива дня и кнопка входящих ---------- */
:root{ --good:#2f8a55; }
html.scheme-dark{ --good:#4fb57a; }
.desk{margin:12px 0 2px;display:flex;flex-direction:column;gap:6px}
.directive{background:var(--card);border-radius:6px;padding:10px 12px 10px 14px;box-shadow:0 1px 0 var(--edge),0 0 0 1px var(--edge)}
.directive .dh{font-size:12.5px;color:var(--hint);display:flex;justify-content:space-between;gap:8px}
.directive .dl{font-size:14px;margin-top:4px;display:flex;gap:8px;align-items:baseline;line-height:1.35}
.directive .dl b{font:600 13px var(--mono);flex:none;min-width:38px}
.directive .up{color:var(--good)} .directive .down{color:var(--ink)}
.directive .calm{color:var(--hint);font-size:13.5px;margin-top:4px}
.inbox-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;border-radius:6px;background:var(--accent);color:var(--accent-text);padding:11px 12px;font:600 14.5px var(--sans);text-align:left}
.inbox-btn .cnt{background:var(--ink);color:#fff;border-radius:10px;font:700 12px/20px var(--mono);min-width:20px;text-align:center;padding:0 6px}
.inbox-btn .go{margin-left:auto;font:500 13px var(--mono);opacity:.85}
.inbox-btn.empty{background:transparent;color:var(--hint);border:1px dashed var(--line-strong);font-weight:500}
.inbox-btn.empty .cnt{display:none}
.inbox-btn:active{transform:scale(.99)}
.chip-dir{display:inline-block;margin-left:6px;font:600 11px var(--mono);border:1px solid;border-radius:4px;padding:0 4px;vertical-align:2px;white-space:nowrap}
.chip-dir.up{color:var(--good)} .chip-dir.down{color:var(--ink)}

/* ---------- Окно входящих ---------- */
.ib-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ib-streak{font:600 12.5px var(--mono);color:var(--good);white-space:nowrap}
.regs{background:var(--folder);border-radius:6px;padding:9px 12px;margin:10px 0 12px;font-size:13.5px}
.regs .rt{font-size:12px;color:var(--hint);margin-bottom:4px}
.regs .r{margin:3px 0;line-height:1.4}
.regs .r b{font-family:var(--mono)}
.doc{background:#fffdf6;border-radius:4px;padding:14px 14px 10px 22px;position:relative;color:#1e2226;
  box-shadow:0 1px 0 var(--edge),0 0 0 1px var(--edge),0 6px 16px rgba(0,0,0,.06)}
.doc::before{content:"";position:absolute;top:0;bottom:0;left:11px;width:1px;background:#b5312a;opacity:.3}
.doc .dt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid rgba(0,0,0,.12);padding-bottom:6px;margin-bottom:4px}
.doc .dt b{font:700 17px var(--mono);white-space:nowrap} .doc .dt span{font-size:13px;color:#676d64;text-align:right}
.doc .f{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.12);font-size:14px}
.doc .f:last-child{border-bottom:0}
.doc .f > span:first-child{color:#676d64;flex:none}
.doc .f > span:last-child{text-align:right}
.doc .sig{font-style:italic;font-size:15px}
.doc .ink-blue{color:#2c4a8a} .doc .ink-black{color:#1e2226} .doc .ink-red{color:#b5312a} .doc .ink-green{color:#2e7d4f}
.doc .stamp{display:inline-block;max-width:190px;border:2.5px solid #2c4a8a;color:#2c4a8a;padding:5px 9px;border-radius:3px;
  font:700 11px/1.25 var(--mono);text-transform:uppercase;letter-spacing:.03em;text-align:center;overflow-wrap:anywhere;
  transform:rotate(-3deg);opacity:.85;box-shadow:inset 0 0 0 2px #fffdf6, inset 0 0 0 3.2px #2c4a8a}   /* штамп печати с названием отдела */
.verdict{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-12deg);border:4px solid;font:700 28px var(--mono);
  letter-spacing:.1em;padding:4px 16px;border-radius:6px;background:rgba(255,253,246,.6);white-space:nowrap;animation:verdictIn .4s ease-out}
@keyframes verdictIn{from{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2)}to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.verdict.no{color:#b5312a;border-color:#b5312a} .verdict.yes{color:#2c4a8a;border-color:#2c4a8a}
.ib-actions{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:14px}
/* таймер документа: прилипает к верху окна, чтобы был виден при прокрутке */
.ib-timer{position:sticky;top:-20px;z-index:2;display:flex;align-items:center;gap:10px;background:var(--card);padding:8px 0 6px;margin:-4px 0 0}
.ib-timer .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ib-timer .bar i{display:block;height:100%;width:100%;background:var(--link);border-radius:3px}
.ib-timer span{font:700 14px var(--mono);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ib-timer.hurry .bar i{background:var(--ink)} .ib-timer.hurry span{color:var(--ink)}
.doc .blank{color:#9a9f97;letter-spacing:.2em}
.ib-actions .btn{justify-content:center}
.ib-note{font:400 12px/1.5 var(--mono);color:var(--hint);text-align:center;margin-top:10px}
.ib-result{margin-top:12px;border-left:3px solid var(--good);padding:7px 10px;font-size:14px;background:rgba(47,138,85,.09);border-radius:0 6px 6px 0;line-height:1.45}
.ib-result.bad{border-color:var(--ink);background:rgba(181,49,42,.08)}
.ib-result b{font-family:var(--mono)}
.empty-desk{text-align:center;padding:24px 10px 6px;color:var(--hint)}
.empty-desk .big{font-size:40px}
.empty-desk p{margin:8px 0}

/* ---------- Справочник ---------- */
.hb{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.hb:last-child{border-bottom:0}
.hb .he{font-size:22px;width:30px;text-align:center;flex:none;line-height:1.2}
.hb .ht{font-weight:600;font-size:15px;margin-bottom:3px}
.hb .hx{font-size:14px;line-height:1.5}
.hb .hx p{margin:0 0 6px}
.hb.locked .he{filter:grayscale(1);opacity:.4}
.hb.locked .ht .rbar{background:var(--text);color:transparent;border-radius:2px;padding:0 4px;opacity:.75}
.hb.locked .hx{color:var(--hint)}

/* ---------- Тост ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:30;
  transform:translateX(-50%) translateY(20px); opacity:0; transition:all .3s;
  background:var(--text); color:var(--card); padding:10px 14px; border-radius:8px;
  font-size:13.5px; max-width:92vw; width:max-content; box-shadow:0 6px 20px rgba(0,0,0,.25); pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* совсем узко (крупный масштаб на маленьком телефоне) */
@media (max-width:300px){
  .icons{gap:3px}
  .icon-btn,.mini .icon-btn{width:30px;height:30px}
  .icon-btn svg{width:17px;height:17px}
  .tab{font-size:11px;padding:8px 2px 7px}
  .po{flex-wrap:wrap}
}
</style>

/* ---------- Справочники ---------- */
const DEPT_BY_ID = Object.fromEntries(DEPARTMENTS.map(d => [d.id, d]));
const UPG_BY_ID = Object.fromEntries(UPGRADES.map(u => [u.id, u]));
const PERK_BY_ID = Object.fromEntries(PERKS.map(p => [p.id, p]));

/* ---------- Состояние игры ---------- */
// prev — предыдущее состояние, если делаем реструктуризацию (сохраняем престиж)
function freshState(prev) {
  const now = Date.now();
  return {
    v: 1,
    docs: 0, stamps: 0,
    runEarned: 0,            // заработано за текущий «финансовый период» (до реструктуризации)
    stampsEarnedRun: 0,
    allTimeEarned: prev ? prev.allTimeEarned : 0,
    seniority: prev ? prev.seniority : 0,
    restructures: prev ? prev.restructures : 0,
    depts: {}, upgrades: [],
    flags: prev ? Object.assign({}, prev.flags) : {},
    buyMode: prev ? prev.buyMode : 1,
    created: prev ? prev.created : now,
    runStarted: now,
    lastSeen: now,
    merits: prev ? (prev.merits || 0) : 0,                                     // почётные грамоты — валюта льгот
    perks: prev && prev.perks ? Object.assign({}, prev.perks) : {},            // купленные льготы (уровни)
    perksOrder: prev && prev.perksOrder ? prev.perksOrder.slice() : [],       // порядок оформления (последняя — в конце)
    achievements: prev && prev.achievements ? prev.achievements.slice() : [],  // полученные достижения
    settings: prev && prev.settings ? Object.assign({}, prev.settings) : null, // настройки переживают реорганизацию
    stats: prev && prev.stats ? Object.assign({}, prev.stats) : null,          // как и личное дело
    inbox: prev && prev.inbox ? JSON.parse(JSON.stringify(prev.inbox)) : null, // входящие переживают реорганизацию
    directive: prev && prev.directive ? Object.assign({}, prev.directive) : null,
  };
}
const owned = (s, id) => s.depts[id] || 0;
const hasUpg = (s, id) => s.upgrades.indexOf(id) !== -1;
function totalOwned(s) { let t = 0; for (const k in s.depts) t += s.depts[k]; return t; }

// Собираем все модификаторы от купленных апгрейдов и престижа
function getMods(s) {
  const m = {
    dept: {}, global: 1, cost: 1,
    capHours: CONFIG.offline.baseCapHours, eff: CONFIG.offline.baseEfficiency,
    stampsOn: false, stampMult: 1, senPer: CONFIG.prestige.bonusPerPoint,
  };
  for (const d of DEPARTMENTS) m.dept[d.id] = 1;
  for (const id of s.upgrades) {
    const u = UPG_BY_ID[id]; if (!u) continue;
    const e = u.effect;
    if (e.type === 'dept') m.dept[e.dept] *= e.mult;
    else if (e.type === 'global') m.global *= e.mult;
    else if (e.type === 'cost') m.cost *= e.mult;
    else if (e.type === 'offlineCap') m.capHours += e.hours;
    else if (e.type === 'offlineEff') m.eff += e.add;
    else if (e.type === 'unlockStamps') m.stampsOn = true;
    else if (e.type === 'stampMult') m.stampMult *= e.mult;
    else if (e.type === 'seniority') m.senPer += e.add;
  }
  // льготы за выслугу
  m.autobuy = 0;
  for (const p of PERKS) {
    const L = (s.perks && s.perks[p.id]) || 0;
    if (!L) continue;
    const e = p.effect;
    if (e.type === 'cost') m.cost *= Math.pow(1 - e.perLevel, L);
    else if (e.type === 'offlineCap') m.capHours += e.perLevel * L;
    else if (e.type === 'offlineEff') m.eff += e.perLevel * L;
    else if (e.type === 'seniority') m.senPer += e.perLevel * L;
    else if (e.type === 'autobuy') m.autobuy = e.intervals[L - 1];
  }
  // директива дня
  const dir = s.directive;
  if (dir && dir.plus && m.dept[dir.plus]) m.dept[dir.plus] *= CONFIG.directive.plusMult;
  if (dir && dir.minus && m.dept[dir.minus]) m.dept[dir.minus] *= CONFIG.directive.minusMult;
  // достижения
  m.global *= 1 + CONFIG.achievementBonus * ((s.achievements || []).length);
  m.eff = Math.min(1, m.eff);
  m.senMult = 1 + s.seniority * m.senPer;
  return m;
}

// Множитель за «вехи»: каждые 25 штук — ×2
function milestoneMult(c) { return Math.pow(CONFIG.milestones.mult, Math.floor(c / CONFIG.milestones.every)); }
function deptRateAt(d, c, m) { return d.baseProd * c * m.dept[d.id] * milestoneMult(c) * m.global * m.senMult; }
function deptRate(s, d, m) { return deptRateAt(d, owned(s, d.id), m); }
function totalRate(s, m) { m = m || getMods(s); let r = 0; for (const d of DEPARTMENTS) r += deptRate(s, d, m); return r; }
function stampRate(s, m) {
  m = m || getMods(s);
  return m.stampsOn ? CONFIG.stamps.perDepartmentPerSec * totalOwned(s) * m.stampMult : 0;
}

// Цена n штук отдела (сумма геометрической прогрессии)
function deptCost(s, d, n, m) {
  const g = CONFIG.costGrowth, c = owned(s, d.id);
  return d.baseCost * m.cost * Math.pow(g, c) * (Math.pow(g, n) - 1) / (g - 1);
}
// Сколько штук можно купить прямо сейчас
// Сколько штук купит кнопка в выбранном режиме: 1, 10, до следующего бонуса ('next') или сколько хватит ('max')
function buyCount(s, d, m) {
  if (s.buyMode === 'max') return maxBuy(s, d, m);
  if (s.buyMode === 'next') { const e = CONFIG.milestones.every; return e - owned(s, d.id) % e; }
  return s.buyMode;
}
function maxBuy(s, d, m) {
  const g = CONFIG.costGrowth;
  const first = d.baseCost * m.cost * Math.pow(g, owned(s, d.id));
  if (s.docs < first) return 0;
  let k = Math.max(1, Math.floor(Math.log(s.docs * (g - 1) / first + 1) / Math.log(g)));
  while (k > 1 && deptCost(s, d, k, m) > s.docs) k--; // защита от погрешности
  return k;
}

function upgradesUnlocked(s) { return !!s.flags.upgradesTab || s.runEarned >= CONFIG.unlocks.upgradesTabEarned || s.restructures > 0; }
function restructureUnlocked(s) { return !!s.flags.restructureTab || s.runEarned >= CONFIG.unlocks.restructureTabEarned || s.restructures > 0; }
function deptVisible(s, d, i) { return i === 0 || owned(s, d.id) > 0 || s.runEarned >= d.baseCost * CONFIG.reveal.deptAtFraction; }

function reqMet(s, u) {
  const r = u.req || {};
  if (r.dept && owned(s, r.dept) < r.count) return false;
  if (r.upgrade && !hasUpg(s, r.upgrade)) return false;
  if (r.earned && s.runEarned < r.earned) return false;
  if (r.restructures && s.restructures < r.restructures) return false;
  return true;
}
// Показываем только купленные или «почти доступные» апгрейды
function upgVisible(s, u, m) {
  if (hasUpg(s, u.id)) return true;
  if (!upgradesUnlocked(s) || !reqMet(s, u)) return false;
  if (u.currency === 'stamps') return m.stampsOn && s.stampsEarnedRun >= u.cost * CONFIG.reveal.upgradeAtFraction;
  return s.runEarned >= u.cost * CONFIG.reveal.upgradeAtFraction;
}
function canAfford(s, u) { return u.currency === 'stamps' ? s.stamps >= u.cost : s.docs >= u.cost; }

function buyDept(s, id, n) {
  const d = DEPT_BY_ID[id], m = getMods(s);
  if (!d || n < 1) return false;
  const c = deptCost(s, d, n, m);
  if (c > s.docs * (1 + 1e-12)) return false;
  s.docs = Math.max(0, s.docs - c);
  s.depts[id] = owned(s, id) + n;
  return true;
}
function buyUpgrade(s, id) {
  const u = UPG_BY_ID[id], m = getMods(s);
  if (!u || hasUpg(s, id) || !upgVisible(s, u, m) || !canAfford(s, u)) return false;
  if (u.currency === 'stamps') s.stamps = Math.max(0, s.stamps - u.cost);
  else s.docs = Math.max(0, s.docs - u.cost);
  s.upgrades.push(id);
  return true;
}

// Начисление дохода за sec секунд с эффективностью eff (1 = онлайн)
function advance(s, sec, eff) {
  if (eff == null) eff = 1;
  const m = getMods(s);
  const d = totalRate(s, m) * sec * eff;
  const st = stampRate(s, m) * sec * eff;
  s.docs += d; s.runEarned += d; s.allTimeEarned += d;
  s.stamps += st; s.stampsEarnedRun += st;
  return { docs: d, stamps: st };
}

/* ---------- Престиж ---------- */
// Сколько выслуги положено за allTime документов: корень, а после мягкого потолка — медленнее
function seniorityTotalFor(allTime) {
  const p = CONFIG.prestige, r = Math.sqrt(allTime / p.divisor);
  return Math.floor(r <= p.softcapAt ? r : p.softcapAt * Math.pow(r / p.softcapAt, p.softcapExp));
}
// Обратная функция: сколько документов нужно за всё время для n единиц выслуги
function allTimeForSeniority(n) {
  const p = CONFIG.prestige;
  const r = n <= p.softcapAt ? n : p.softcapAt * Math.pow(n / p.softcapAt, 1 / p.softcapExp);
  return p.divisor * r * r;
}
function seniorityGain(s) { return Math.max(0, seniorityTotalFor(s.allTimeEarned) - s.seniority); }
function canRestructure(s) { return s.runEarned >= CONFIG.prestige.minRunEarned && seniorityGain(s) >= 1; }
function nextSeniorityAt(s) {
  return allTimeForSeniority(Math.max(seniorityTotalFor(s.allTimeEarned), s.seniority) + 1);
}
function restructure(s) {
  const g = seniorityGain(s);
  const n = freshState(s);
  n.seniority = s.seniority + g;
  n.merits = (s.merits || 0) + g;          // грамоты начисляются вместе с выслугой
  n.restructures = s.restructures + 1;
  applyStartPerks(n);
  return n;
}
// Стартовые бонусы льгот в начале нового периода
function applyStartPerks(n) {
  for (const p of PERKS) {
    const L = (n.perks && n.perks[p.id]) || 0;
    if (!L) continue;
    const e = p.effect;
    if (e.type === 'startDepts') DEPARTMENTS.slice(0, L).forEach(d => { n.depts[d.id] = owned(n, d.id) + e.count; });
    else if (e.type === 'startDocs') n.docs += e.values[L - 1];
    else if (e.type === 'startUpgrade' && !hasUpg(n, e.upgrade)) n.upgrades.push(e.upgrade);
  }
}
function perkLevel(s, id) { return (s.perks && s.perks[id]) || 0; }
function perkCost(s, p) { const L = perkLevel(s, p.id); return L < p.costs.length ? p.costs[L] : Infinity; }
function buyPerk(s, id) {
  const p = PERK_BY_ID[id]; if (!p) return false;
  const cost = perkCost(s, p);
  if (!isFinite(cost) || (s.merits || 0) < cost) return false;
  s.merits -= cost;
  s.perks = s.perks || {};
  s.perks[id] = perkLevel(s, id) + 1;
  s.perksOrder = (s.perksOrder || []).filter(x => x !== id).concat(id);
  if (p.effect.type === 'startUpgrade' && !hasUpg(s, p.effect.upgrade)) s.upgrades.push(p.effect.upgrade);
  return true;
}
// Проверка достижений; возвращает только что полученные
function updateAchievements(s) {
  s.achievements = s.achievements || [];
  const rate = totalRate(s), got = [];
  for (const a of ACHIEVEMENTS) {
    if (s.achievements.indexOf(a.id) === -1 && a.check(s, rate)) { s.achievements.push(a.id); got.push(a); }
  }
  return got;
}

/* =====================================================================
   ТЕКСТЫ (I18N)
   ui — строки интерфейса, {name} — подстановки
   lists — шутки, служебные записки, письмо о назначении

/* =====================================================================
   ЗВУКИ — синтезируются через Web Audio API, без файлов.
   Каждый рецепт получает (A, t): A — звуковой движок, t — время старта.
   A.tone(t, {...}) — тон, A.hiss(t, {...}) — отфильтрованный шум.
   ===================================================================== */
const SFX = {
  // царапанье ручки — ручная подпись
  sign(A, t) {
    A.hiss(t, { dur: 0.06, gain: 0.12, freq: 3200, q: 3 });
    A.hiss(t + 0.07, { dur: 0.05, gain: 0.09, freq: 4200, q: 3 });
  },
  // удар резиновой печати — покупка отдела
  stamp(A, t) {
    A.tone(t, { freq: 150, freqEnd: 45, dur: 0.16, gain: 0.7, attack: 0.002 });
    A.hiss(t, { dur: 0.06, gain: 0.35, filter: 'lowpass', freq: 1200 });
    A.hiss(t, { dur: 0.015, gain: 0.12, filter: 'highpass', freq: 5000 });
  },
  // звонок на ресепшене — апгрейд
  upgrade(A, t) {
    A.hiss(t, { dur: 0.012, gain: 0.1, filter: 'highpass', freq: 6000 });
    A.tone(t, { freq: 1568, dur: 1.1, gain: 0.2 });
    A.tone(t, { freq: 1573, dur: 1.1, gain: 0.1 });
    A.tone(t, { freq: 3920, dur: 0.5, gain: 0.06 });
  },
  // кассовый аппарат — веха ×2 и доступность реорганизации
  milestone(A, t) {
    A.hiss(t, { dur: 0.05, gain: 0.3, freq: 1400, q: 1.5 });
    A.hiss(t + 0.05, { dur: 0.03, gain: 0.2, freq: 2600, q: 2 });
    [2093, 2637, 3136].forEach((f, i) => A.tone(t + 0.08 + i * 0.015, { freq: f, dur: 0.8, gain: 0.12 }));
  },
  // офисный телефон — открылся новый отдел или вкладка
  ring(A, t) {
    for (let b = 0; b < 2; b++)
      for (let i = 0; i < 9; i++)
        A.tone(t + b * 0.42 + i * 0.035, { freq: i % 2 ? 1040 : 880, type: 'triangle', dur: 0.04, gain: 0.08, attack: 0.003 });
  },
  // шелест бумаг и колокольчик — подтверждение акта об отсутствии
  welcome(A, t) {
    A.hiss(t, { dur: 0.22, gain: 0.25, freq: 900, freqEnd: 2800, q: 0.8 });
    A.hiss(t + 0.2, { dur: 0.25, gain: 0.22, freq: 1200, freqEnd: 3500, q: 0.8 });
    A.tone(t + 0.45, { freq: 1318, dur: 0.9, gain: 0.13 });
  },
  // шредер — реорганизация и полный сброс
  shredder(A, t) {
    const c = A.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), d = 1.4;
    o.type = 'sawtooth'; o.frequency.value = 75;
    f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.05);
    for (let k = 0.1; k < d - 0.1; k += 0.07) g.gain.setValueAtTime(0.1 + Math.random() * 0.1, t + k);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(f); f.connect(g); g.connect(A.master);
    o.start(t); o.stop(t + d + 0.05);
    A.hiss(t, { dur: d, gain: 0.16, freq: 1500, q: 0.7, attack: 0.05 });
  },
  // шорох листа — переключение вкладок
  tab(A, t) { A.hiss(t, { dur: 0.035, gain: 0.08, filter: 'highpass', freq: 2500 }); },
  tick(A, t) { A.tone(t, { freq: 950, type: 'square', dur: 0.018, gain: 0.03 }); },
  // глухое «бззз» — ошибка во входящих
  error(A, t) {
    A.tone(t, { freq: 220, type: 'square', dur: 0.13, gain: 0.045 });
    A.tone(t + 0.15, { freq: 160, type: 'square', dur: 0.22, gain: 0.045 });
  },
  // щелчок — переключатели
  click(A, t) { A.tone(t, { freq: 1200, type: 'square', dur: 0.025, gain: 0.035 }); },
};

/* ---------- Полноэкранный режим ----------
   В Telegram — requestFullscreen из Bot API 8.0 (на старых клиентах пункта нет),
   в обычном браузере и на itch.io — стандартный Fullscreen API. */
const Fullscreen = {
  inTg: IN_TG && tgv('8.0'),
  available() { return this.inTg || (!IN_TG && !!document.fullscreenEnabled); },
  active() { return this.inTg ? !!tg.isFullscreen : !!document.fullscreenElement; },
  set(on) {
    if (on === this.active()) return;
    try {
      if (this.inTg) { if (on) tg.requestFullscreen(); else tg.exitFullscreen(); }
      else if (on) document.documentElement.requestFullscreen().catch(() => this.failed());
      else document.exitFullscreen();
    } catch (e) { this.failed(); }
  },
  failed() { if (S) S.settings.fullscreen = false; toast(t('tFsFail')); this.changed(); },
  changed() { if (modalKind === 'settings') showSettings(); },   // обновить переключатель
};
/* ---------- Тема ----------
   'auto': в Telegram — тема Telegram, в браузере — системная.
   'light' / 'dark': собственные «бумажные» палитры игры. */
function colorScheme() {
  const th = S ? S.settings.theme : 'auto';
  if (th === 'light' || th === 'dark') return th;
  if (IN_TG) return tg.colorScheme === 'dark' ? 'dark' : 'light';
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
  const html = document.documentElement, th = S ? S.settings.theme : 'auto', scheme = colorScheme();
  html.classList.toggle('theme-light', th === 'light');
  html.classList.toggle('theme-dark', th === 'dark');
  html.classList.toggle('scheme-dark', scheme === 'dark');
  html.style.colorScheme = scheme;   // браузер красит скроллбары и поля ввода под схему
  // В Telegram шапку и фон окна красим под выбранную тему (в «Авто» — цвета самого Telegram)
  if (IN_TG && tgv('6.1')) {
    const bg = th === 'auto' ? 'bg_color' : getComputedStyle(html).getPropertyValue('--bg').trim();
    try { tg.setBackgroundColor(bg); } catch (e) {}
    try { tg.setHeaderColor(th === 'auto' || !tgv('6.9') ? 'bg_color' : bg); } catch (e) {}
  }
}
if (IN_TG) { try { tg.onEvent('themeChanged', applyTheme); } catch (e) {} }
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

if (Fullscreen.inTg) {
  tg.onEvent('fullscreenChanged', () => Fullscreen.changed());
  tg.onEvent('fullscreenFailed', e => { if (!e || e.error !== 'ALREADY_FULLSCREEN') Fullscreen.failed(); });
}
document.addEventListener('fullscreenchange', () => Fullscreen.changed());

  }
  showModal({ form: t('awayForm'), title: '📬 ' + t('awayTitle'), stamp: t('stampReceived'), body,
    buttons: [{ label: t('awayBtn'), onClick: () => Sound.play('welcome') }] });
  if (gained.docs > 0) haptic.success();
}

// Начисляем офлайн-доход с учётом лимита и эффективности
function applyAway(sec) {
  S.stats.maxAway = Math.max(S.stats.maxAway || 0, sec);
  inboxAccrue(sec);
  const m = getMods(S);
  const counted = Math.min(sec, m.capHours * 3600);
  const gained = advance(S, counted, m.eff);
  S.stats.offlineEarned += gained.docs;
  checkUnlocks(true);
  const mode = S.settings.awayReport;
  if (mode === 'always' || (mode === 'long' && sec >= 1800)) showAway(sec, counted, gained, m);
  else if (gained.docs > 0) toast(t('awayToast', { n: fmt(gained.docs) }));
}

/* ---------- Проверка открытия механик ---------- */
function checkUnlocks(silent) {
  const notify = (msg, sfx) => { if (silent) return; toast(msg); haptic.success(); Sound.play(sfx); };
  if (!S.flags.upgradesTab && upgradesUnlocked(S)) { S.flags.upgradesTab = true; notify(t('tUpgTab'), 'ring'); }
  if (!S.flags.restructureTab && restructureUnlocked(S)) { S.flags.restructureTab = true; notify(t('tRestrTab'), 'ring'); }
  unlockInbox(silent);
  DEPARTMENTS.forEach((d, i) => {
    const f = 'seen_' + d.id;
    if (i > 0 && !S.flags[f] && deptVisible(S, d, i)) { S.flags[f] = true; notify(t('tNewDept', { e: d.emoji, name: dName(d) }), 'ring'); }
  });
  // restrNotified — номер реорганизации, о доступности которой уже сообщили
  if (canRestructure(S) && !(S.flags.restrNotified >= S.restructures)) {
    S.flags.restrNotified = S.restructures; notify(t('tCanRestr'), 'milestone');
  }
}

function renderDepts(m, rate) {
  buildDepts();
  const every = CONFIG.milestones.every;
  for (const [id, f] of refs.depts) {
    const d = DEPT_BY_ID[id], c = owned(S, id);
    const total = deptRate(S, d, m);
    const each = c > 0 ? total / c : deptRateAt(d, 1, m);
    setText(f.owned, '×' + c);
    setText(f.stats, c > 0
      ? t('each', { v: fmtRate(each) }) + ' · ' + t('total', { v: fmtRate(total) }) + (rate > 0 ? ` · ${Math.round(total / rate * 100)}%` : '')
      : t('each', { v: fmtRate(each) }));

    const want = buyCount(S, d, m), n = Math.max(1, want);
    // полоска до бонуса: сплошная часть — что есть, бледная — что добавит покупка (кроме режима ×1)

    setText(f.ms, t('milestone', { c, next: (Math.floor(c / every) + 1) * every, m: CONFIG.milestones.mult }));

}

// Автоматические заявки: покупаем самый дешёвый доступный отдел
function autoBuy(dt, m) {
  if (!m.autobuy || S.flags.autobuyOff) { autoTimer = 0; return; }
  autoTimer += dt;
  let guard = 0;
  while (autoTimer >= m.autobuy && guard++ < 20) {
    autoTimer -= m.autobuy;
    let best = null, bestCost = Infinity;
    DEPARTMENTS.forEach((d, i) => {
      if (!deptVisible(S, d, i)) return;
      const c = deptCost(S, d, 1, m);
      if (c < bestCost) { bestCost = c; best = d; }
    });
    if (!best || bestCost > S.docs) break;
    if (buyDept(S, best.id, 1)) { S.stats.bought++; stampFx('d-' + best.id); }
  }
  if (autoTimer > m.autobuy) autoTimer = m.autobuy;
}

/* =====================================================================
   ДИРЕКТИВА ДНЯ И ВХОДЯЩИЕ
   Директива и регламент выбираются по дате (одинаково на всех устройствах),
   документы — случайно. Всё, что выбрано, хранится в сохранении.
   ===================================================================== */
// Ключ дня по местному времени: '2026-11-08'
function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dateFromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function keyDaysAgo(n) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return todayKey(d); }
function daysAgo(k) { return Math.round((dateFromKey(todayKey()) - dateFromKey(k)) / 864e5); }
const isWeekendKey = k => { const w = dateFromKey(k).getDay(); return w === 0 || w === 6; };
function fmtDay(k, weekday) {
  const opts = weekday ? { weekday: 'short', day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long' };
  return dateFromKey(k).toLocaleDateString(LANG === 'ru' ? 'ru-RU' : 'en-GB', opts);
}
// Генератор случайных чисел с зерном: для одной даты всегда одна и та же последовательность
function seededRandom(str) {
  let a = 2166136261;
  for (let i = 0; i < str.length; i++) a = Math.imul(a ^ str.charCodeAt(i), 16777619) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), a | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const pickR = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
const inboxOpen = () => !!(S && S.flags.inboxOpen && S.inbox);
const ownedDeptIds = () => DEPARTMENTS.filter(d => owned(S, d.id) > 0).map(d => d.id);
const curve = k => k / (k + CONFIG.inbox.curve);   // 0 → 1, половина на curve-й реорганизации

/* ---------- Директива дня ---------- */
function rollDirective(key) {
  const rnd = seededRandom('directive:' + key), c = CONFIG.directive, pool = ownedDeptIds();
  const dir = { key, plus: null, minus: null, plusText: Math.floor(rnd() * 1e6), minusText: Math.floor(rnd() * 1e6), noneText: Math.floor(rnd() * 1e6) };
  if (pool.length && rnd() < c.plusChance) dir.plus = pickR(rnd, pool);
  const rest = pool.filter(id => id !== dir.plus);
  if (rest.length && rnd() < c.minusChance) dir.minus = pickR(rnd, rest);
  return dir;
}

/* ---------- Регламент: правила проверки документов ----------
   broken(doc, regs) — нарушает ли документ правило;
   violate(doc, rnd, regs) — испортить документ так, чтобы правило нарушалось.
   tier 0 — простые правила с первого дня, tier 1 — после первой реорганизации, tier 2 — после пятой.
   Поля документа: subject < 0 — тема не заполнена; copy — копия; sealDept — чья печать (null — того же отдела). */
const docNames = () => tlist('names').length, docSubjects = () => tlist('subjects').length;
const sealOf = d => (d.sealDept && DEPT_BY_ID[d.sealDept] ? d.sealDept : d.dept);

function lastWeekendAgo(rnd) {
  const opts = [0, 1, 2, 3, 4, 5, 6].filter(n => isWeekendKey(keyDaysAgo(n)));
  return pickR(rnd, opts);
}
const INBOX_RULES = [
  { id: 'weekend',   tier: 0, broken: d => isWeekendKey(d.date),         violate: (d, rnd) => { d.date = keyDaysAgo(lastWeekendAgo(rnd)); } },
  { id: 'seal',      tier: 0, broken: d => !d.seal,                       violate: d => { d.seal = false; } },
  { id: 'evenPages', tier: 0, broken: d => d.pages % 2 === 1,             violate: (d, rnd) => { d.pages = pickR(rnd, [3, 5, 7, 9]); } },
  { id: 'noRed',     tier: 0, broken: d => d.ink === 'red',               violate: d => { d.ink = 'red'; } },
  { id: 'twoSigsB',  tier: 0, broken: d => d.letter === 'B' && d.sigs.length < 2, violate: d => { d.letter = 'B'; d.sigs = d.sigs.slice(0, 1); } },
  { id: 'inkDept',   tier: 1, broken: (d, r) => d.dept === r.inkDept && d.ink !== 'blue',
    violate: (d, rnd, r) => { d.dept = r.inkDept; d.ink = pickR(rnd, ['black', 'green', 'red']); } },
  { id: 'stale',     tier: 1, broken: d => daysAgo(d.date) > 3,           violate: (d, rnd) => { d.date = keyDaysAgo(4 + Math.floor(rnd() * 3)); } },
  { id: 'maxPages',  tier: 1, broken: d => d.pages > 10,                  violate: (d, rnd) => { d.pages = pickR(rnd, [12, 14, 16]); } },
  { id: 'future',    tier: 1, broken: d => daysAgo(d.date) < 0,           violate: (d, rnd) => { d.date = keyDaysAgo(-1 - Math.floor(rnd() * 2)); } },
  // v1.14
  { id: 'copy',      tier: 0, broken: d => !!d.copy,                      violate: d => { d.copy = true; } },
  { id: 'blank',     tier: 0, broken: d => d.subject < 0,                 violate: d => { d.subject = -1; } },
  { id: 'sealMatch', tier: 1, broken: d => !!d.seal && sealOf(d) !== d.dept,
    violate: (d, rnd) => {
      const others = DEPARTMENTS.filter((x, i) => x.id !== d.dept && (owned(S, x.id) > 0 || i < 4)).map(x => x.id);
      d.seal = true; d.sealDept = pickR(rnd, others);

  { id: 'dupSig',    tier: 1, broken: d => d.sigs.length > 1 && d.sigs[0] % docNames() === d.sigs[1] % docNames(),
    violate: d => { d.sigs = [d.sigs[0], d.sigs[0]]; } },
  { id: 'formBand',  tier: 1, broken: d => d.form >= 90,                  violate: (d, rnd) => { d.form = 90 + Math.floor(rnd() * 10); } },
  { id: 'subjectBan', tier: 2, broken: (d, r) => r.banSubject != null && d.subject >= 0 && d.subject % docSubjects() === r.banSubject,
    violate: (d, rnd, r) => { if (r.banSubject != null) d.subject = r.banSubject; } },
  { id: 'signerBan', tier: 2, broken: (d, r) => r.banSigner != null && d.sigs.some(i => i % docNames() === r.banSigner),
    violate: (d, rnd, r) => { if (r.banSigner != null) d.sigs[d.sigs.length - 1] = r.banSigner; } },
  { id: 'seriesDept', tier: 2, broken: (d, r) => !!r.seriesDept && d.letter === 'R' && d.dept !== r.seriesDept,
    violate: (d, rnd, r) => {
      const others = ownedDeptIds().filter(id => id !== r.seriesDept);

const RULE_BY_ID = Object.fromEntries(INBOX_RULES.map(r => [r.id, r]));
function rulesCount(k) { let n = 0; for (const [from, count] of CONFIG.inbox.rulesByRestructures) if (k >= from) n = count; return n; }
function rollRules(key) {
  const k = S.restructures, rnd = seededRandom('rules:' + key + ':' + rulesCount(k));
  const tier = k >= CONFIG.inbox.tier2At ? 2 : k >= CONFIG.inbox.tier1At ? 1 : 0;
  const pool = INBOX_RULES.filter(r => r.tier <= tier).map(r => r.id);
  const ids = [];
  while (ids.length < rulesCount(k) && pool.length) ids.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  const senders = ownedDeptIds();
  const regs = { key, ids, inkDept: senders.length ? pickR(rnd, senders) : 'approvals' };
  // v1.14: запрещённая тема, сотрудник в отпуске, отдел для серии R (бросаем после старых — прежние дни не меняются)
  regs.banSubject = Math.floor(rnd() * docSubjects());

}
const activeRules = () => S.inbox.rules.ids.map(id => RULE_BY_ID[id]).filter(Boolean);

/* ---------- Документы ---------- */
function makeDoc() {
  const regs = S.inbox.rules, rules = activeRules(), rnd = Math.random;
  const senders = ownedDeptIds(); if (!senders.length) senders.push('intern');
  // Исходный документ без нарушений: номер до 89, серия не R, подписи и тема — не запрещённые сегодня
  const names = [...Array(docNames()).keys()].filter(i => i !== regs.banSigner).sort(() => rnd() - 0.5);
  const subjects = [...Array(docSubjects()).keys()].filter(i => i !== regs.banSubject);
  const weekdays = [0, 1, 2, 3].filter(n => !isWeekendKey(keyDaysAgo(n)));
  const d = {
    form: 10 + Math.floor(rnd() * 80), letter: pickR(rnd, ['A', 'B', 'C', 'D', 'F', 'P', 'S']),
    dept: regs.inkDept && senders.includes(regs.inkDept) && rnd() < 0.35 ? regs.inkDept : pickR(rnd, senders),
    date: keyDaysAgo(weekdays.length ? pickR(rnd, weekdays) : 0),
    sigs: names.slice(0, 2), ink: 'blue', pages: pickR(rnd, [2, 4, 6, 8, 10]), seal: true,
    subject: pickR(rnd, subjects), copy: false, sealDept: null,
  };
  if (d.dept !== regs.inkDept && rnd() < 0.4) d.ink = 'black';
  // «подозрительные» детали, которые сегодняшний регламент разрешает: проверяем, что ни одно правило не нарушено
  for (const rule of [...INBOX_RULES].sort(() => rnd() - 0.5)) {
    if (rnd() >= CONFIG.inbox.decoyChance) continue;
    const copy = JSON.parse(JSON.stringify(d));
    rule.violate(copy, rnd, regs);
    if (!rules.some(r => r.broken(copy, regs))) Object.assign(d, copy);
  }
  // примерно половина документов — с настоящим нарушением
  if (rules.length && rnd() < CONFIG.inbox.invalidChance) pickR(rnd, rules).violate(d, rnd, regs);
  return d;
}
const inboxRewardMin = () => CONFIG.inbox.rewardMin + CONFIG.inbox.rewardBonusMax * curve(S.restructures);
const inboxPenaltyMin = () => CONFIG.inbox.penaltyMax * curve(S.restructures);
const streakMult = () => 1 + CONFIG.inbox.streakStep * Math.min(S.inbox.streak, CONFIG.inbox.streakMax);
function inboxReward() { return totalRate(S) * 60 * inboxRewardMin() * streakMult(); }
function inboxPenalty() { return Math.min(totalRate(S) * 60 * inboxPenaltyMin(), S.docs * CONFIG.inbox.penaltyBalanceCap); }

/* ---------- Ежедневное обновление, накопление, открытие ---------- */
function ensureDaily() {
  if (!inboxOpen()) return;
  const key = todayKey(), ib = S.inbox;
  if (!S.directive || S.directive.key !== key) { S.directive = rollDirective(key); deptKey = deskKey = ''; }
  if (!ib.rules || ib.rules.key !== key) ib.rules = rollRules(key);
  if (!ib.day || ib.day.key !== key) ib.day = { key, ok: 0, bad: 0, earned: 0 };
}
// Документы копятся на столе, пока игрок в игре и пока его нет
function inboxAccrue(sec) {
  if (!inboxOpen()) return;
  const ib = S.inbox, step = CONFIG.inbox.everyMin * 60;
  if (ib.count >= CONFIG.inbox.max) { ib.timer = 0; return; }
  ib.timer += sec;
  while (ib.timer >= step && ib.count < CONFIG.inbox.max) { ib.count++; ib.timer -= step; }

}

}

// Сколько секунд даётся на документ (с реорганизациями — меньше)
function inboxSeconds() { let n = 30; for (const [from, sec] of CONFIG.inbox.secondsByRestructures) if (S.restructures >= from) n = sec; return n; }
/* Таймер идёт, только пока документ открыт на экране и игра не свёрнута:

let ibTimerKey = '';
function updateInboxTimer(dt) {

  if (modalKind !== 'inbox' || inboxResult || !isDoc(d) || !el || Tabs.asleep) return;
  const before = d.left;
  d.left = Math.max(0, d.left - dt);
  const total = inboxSeconds(), sec = Math.ceil(d.left);
  const key = sec + '|' + Math.round(d.left / total * 200);

    el.classList.toggle('hurry', d.left <= 5);
  }

  if (d.left <= 0) decideDoc(null, true);

// approve: true — одобрить, false — отказать; timeout — время вышло (считается ошибкой)
function decideDoc(approve, timeout) {
  const ib = S.inbox, d = ib.current;
  if (!isDoc(d)) return;
  const rules = activeRules(), broken = rules.filter(r => r.broken(d, ib.rules));
  const valid = broken.length === 0, correct = !timeout && approve === valid;
  let amount;
  if (correct) {
    amount = inboxReward();
    S.docs += amount; S.runEarned += amount; S.allTimeEarned += amount;
    ib.streak++; S.stats.inboxOk++; ib.day.ok++; ib.day.earned += amount;
    S.stats.bestStreak = Math.max(S.stats.bestStreak, ib.streak);
    S.stats.inboxEarned += amount;
  } else {
    amount = inboxPenalty();
    S.docs = Math.max(0, S.docs - amount);
    ib.streak = 0; S.stats.inboxBad++; ib.day.bad++; ib.day.earned -= amount;
    S.stats.inboxLost += amount;
    if (timeout) S.stats.inboxTimeout++;
  }
  // скрытые благодарности
  if (correct && d.left <= 1) grantAch('lastsec');
  if (!timeout && new Date().getHours() < 5) grantAch('night');
  ib.count = Math.max(0, ib.count - 1);
  ib.current = null;
  inboxResult = { doc: d, approve, correct, amount, timeout: !!timeout, rule: broken[0] ? broken[0].id : null, ruleNo: broken[0] ? rules.indexOf(broken[0]) + 1 : 0 };
  haptic.light(); Sound.play('stamp');
  setTimeout(() => { if (correct) Sound.play('upgrade'); else { Sound.play('error'); haptic.success(); } }, 220);
  checkAchievements();
  render(); save();
  showInbox();
}
$('sheet').addEventListener('click', e => {

  switch (b.dataset.ib) {
    case 'approve': decideDoc(true); break;
    case 'deny': decideDoc(false); break;
    case 'return':
      S.inbox.count = Math.max(0, S.inbox.count - 1); S.inbox.current = null;
      S.stats.inboxReturned++; S.inbox.day.ret = (S.inbox.day.ret || 0) + 1;
      Sound.play('tab'); render(); save(); showInbox(); break;
    case 'next': inboxResult = null; Sound.play('tab'); if (S.inbox.count) showInbox(); else closeModal(); break;
    case 'close': inboxResult = null; closeModal(); break;
  }
});

/* ---------- Главная отрисовка ----------
   Шапка и вкладки обновляются всегда, содержимое — только у открытой вкладки. */
function render() {
  const m = getMods(S);
  const rate = totalRate(S, m), sRate = stampRate(S, m);
  curRate = rate; curSRate = sRate;   // для плавного счётчика в шапке
  if (rate > S.stats.peakRate) S.stats.peakRate = rate;
  setText($('rate'), '+' + fmtRate(rate) + ' ' + t('perSec'));
  setText($('miniRate'), '+' + fmtRate(rate) + t('perS'));
  $('stampsLine').hidden = !m.stampsOn;
  if (m.stampsOn) setText($('stampRate'), '+' + fmtRate(sRate) + t('perS'));
  $('senLine').hidden = S.seniority <= 0;
  // Грамоты и печати — всегда на виду: в шапке и в мини-полоске при прокрутке
  const meritsOn = S.restructures > 0 || S.merits > 0;
  $('meritsLine').hidden = !meritsOn;
  if (meritsOn) { setText($('meritsTop'), fmt(S.merits || 0)); setText($('miniMerits'), fmt(S.merits || 0)); }
  $('miniStampsW').hidden = !m.stampsOn;
  $('miniMeritsW').hidden = !meritsOn;
  $('miniSub').hidden = !(m.stampsOn || meritsOn);
  $('mini').classList.toggle('two', !!(m.stampsOn || meritsOn));
  if (S.seniority > 0) { setText($('sen'), fmt(S.seniority)); setText($('senBonus'), '+' + Math.round(S.seniority * m.senPer * 100) + '%'); }
  // Кнопка ручной подписи уходит на второй план после первой покупки — и навсегда после первой реорганизации
  $('signBtn').classList.toggle('minor', totalOwned(S) > 0 || S.restructures > 0);
  // Точка на кнопке справочника
  const hbNew = hbOpenCount() > (S.flags.hbSeen || 0);
  document.querySelectorAll('[data-act="handbook"]').forEach(b => b.classList.toggle('dot', hbNew));

  // Вкладки
  const locks = { depts: false, upgs: !upgradesUnlocked(S), restr: !restructureUnlocked(S) };
  if (locks[activeTab]) activeTab = 'depts';
  document.querySelectorAll('.tab').forEach(tb => {
    const id = tb.dataset.id;
    setDisabled(tb, locks[id]);
    setText(tb.querySelector('.t-ico'), locks[id] ? '🔒 ' : '');
    tb.classList.toggle('active', id === activeTab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + activeTab));

  // Значок на вкладке улучшений нужен всегда, сами карточки — только когда вкладка открыта
  const avail = visibleUpgrades(m);
  const affordable = avail.filter(u => canAfford(S, u)).length;
  const badge = $('upgBadge');
  badge.hidden = affordable === 0; setText(badge, affordable);

  renderDesk();

  if (activeTab === 'depts') renderDepts(m, rate);
  else if (activeTab === 'upgs') renderUpgrades(avail, rate, sRate);
  else { renderRestructure(m); renderPerks(); }
}

/* ---------- Эффект печати на карточке ---------- */
function stampFx(cardId) {
  if (!S.settings.animations) return;
  const card = $(cardId); if (!card) return;
  const s = document.createElement('div');
  s.className = 'stamp-anim'; s.textContent = t('stampApproved');
  const prev = card.querySelector('.stamp-anim'); if (prev) prev.remove();   // при удержании печать «перештамповывается»
  card.appendChild(s); setTimeout(() => s.remove(), 1100);
}

/* ---------- Действия игрока ---------- */
function onSign(btn) {
  const a = CONFIG.manualSignAmount;
  S.docs += a; S.runEarned += a; S.allTimeEarned += a; S.stats.signs++;
  haptic.light(); Sound.play('sign');
  if (S.settings.animations) {
    const f = document.createElement('span');
    f.className = 'float-num'; f.textContent = '+' + a;
    btn.appendChild(f); setTimeout(() => f.remove(), 800);
  }
  render();
}
let lastStampSfx = 0;
function onBuyDept(id) {
  const d = DEPT_BY_ID[id], m = getMods(S);
  const n = buyCount(S, d, m);
  const before = owned(S, id);
  if (!buyDept(S, id, n)) return false;
  S.stats.bought += n;
  haptic.light();
  const now = Date.now();
  if (now - lastStampSfx > 90) { Sound.play('stamp'); lastStampSfx = now; }
  stampFx('d-' + id);
  const every = CONFIG.milestones.every;
  if (Math.floor(owned(S, id) / every) > Math.floor(before / every)) {
    toast(t('tMilestone', { name: dName(d), n: Math.floor(owned(S, id) / every) * every, m: CONFIG.milestones.mult }));
    haptic.success(); setTimeout(() => Sound.play('milestone'), 150);
  }
  if (before === 0 && totalOwned(S) === n && id === DEPARTMENTS[0].id) toast(t('tFirstDept'));
  else if (before === 0 && S.settings.memos) { pendingMemo = draw('memosNewDept').replace(/\{dept\}/g, dName(d)); rotateMemo(); }
  render();
  return true;
}
function onBuyUpg(id) {
  const u = UPG_BY_ID[id];
  if (!buyUpgrade(S, id)) return;
  S.stats.upgBought++;
  haptic.light(); Sound.play('upgrade');
  if (u.effect.type === 'unlockStamps') { toast(t('tStamps')); haptic.success(); }
  else toast(t('tApproved', { name: uName(u) }));
  render(); save();
}
function onRestructure() {
  if (!canRestructure(S)) return;
  const gain = seniorityGain(S), m = getMods(S);
  const total = S.seniority + gain;
  showModal({
    form: t('rcForm'), title: t('rcTitle'), stamp: t('stampBoard'),
    body: `<p>${t('rcGain', { g: fmt(gain) })}</p><p>${t('rcTotal', { t: fmt(total), p: Math.round(total * m.senPer * 100) })}</p>` +
      `<p class="hint" style="font-size:13px">${t('rcWarn')}</p>`,
    buttons: [
      { label: t('rcBtn'), onClick: () => {
          // личное дело: печати и длительность периода; «Минималист» — период без купленных улучшений
          const st = S.stats, runSec = (Date.now() - (S.runStarted || Date.now())) / 1000;
          const perkUpg = PERKS.filter(p => p.effect.type === 'startUpgrade' && perkLevel(S, p.id) > 0).map(p => p.effect.upgrade);
          const noUpg = S.upgrades.every(id => perkUpg.includes(id));
          st.stampsEarned += S.stampsEarnedRun || 0;
          if (runSec > 0) st.bestRunSec = st.bestRunSec ? Math.min(st.bestRunSec, runSec) : runSec;
          S = restructure(S); ensureSettings(S);
          if (noUpg) grantAch('noupg');
          deptKey = upgKey = filedKey = perkKey = '';
          activeTab = 'depts';
          haptic.success(); Sound.play('shredder');
          toast(t('tRestructured', { n: fmt(S.seniority) }));
          save(); render();
        } },
      { label: t('cancel'), ghost: true },
    ],
  });
}
function onReset() {
  showModal({
    form: t('resetForm'), title: t('resetTitle'), stamp: t('stampVoid'), body: `<p>${t('resetBody')}</p>`,
    buttons: [
      { label: t('resetBtn'), danger: true, onClick: () => {
          const keep = Object.assign({}, S.settings);   // настройки переживают сброс
          Store.wipe(); S = ensureSettings(freshState()); S.settings = keep;
          deptKey = upgKey = filedKey = perkKey = ''; activeTab = 'depts';
          Sound.play('shredder');
          syncBuyMode(); save(); render(); showIntro();
        } },
      { label: t('cancel'), ghost: true, onClick: showSettings },
    ],
  });
}
function showIntro() {
  showModal({ form: t('introForm'), title: '🗂️ ' + t('introTitle'), stamp: t('stampHired'),
    body: tlist('intro').map(p => `<p>${p}</p>`).join(''),
    buttons: [{ label: t('introBtn'), onClick: () => Sound.play('stamp') }] });
}

function syncBuyMode() {
  document.querySelectorAll('.po button').forEach(b => b.classList.toggle('on', String(S.buyMode) === b.dataset.id));
}

// Один обработчик кликов на всё (делегирование)
document.addEventListener('click', e => {
  const tEl = e.target.closest('[data-act]');
  if (!tEl || tEl.disabled) return;
  const id = tEl.dataset.id;
  switch (tEl.dataset.act) {
    case 'sign': onSign(tEl); break;
    case 'buyDept': if (hold.fired) { hold.fired = false; break; } onBuyDept(id); break;
    case 'buyUpg': onBuyUpg(id); break;
    case 'tab':
      if (activeTab !== id) {
        Sound.play('tab');
        // раскрытые списки купленного сворачиваем, чтобы вкладка открывалась в обычном виде
        document.querySelectorAll('details.filed[open]').forEach(d => { d.open = false; });
        filedOpen = perkFiledOpen = false;
      }
      activeTab = id; $('scroller').scrollTo({ top: 0 }); render(); break;
    case 'mode': S.buyMode = id === 'max' || id === 'next' ? id : +id; syncBuyMode(); haptic.light(); Sound.play('click'); render(); break;
    case 'restructure': onRestructure(); break;
    case 'settings': Sound.play('click'); showSettings(); break;
    case 'achievements': Sound.play('click'); showAchievements(); break;
    case 'handbook': Sound.play('click'); showHandbook(); break;
    case 'stats': Sound.play('click'); showStats(); break;
    case 'inbox': Sound.play('click'); inboxResult = null; showInbox(); break;
    case 'buyPerk': {
      const p = PERK_BY_ID[id];
      if (buyPerk(S, id)) { haptic.success(); Sound.play('upgrade'); toast(t('tPerk', { name: pText(p).name })); save(); render(); }
      break;
    }
    case 'toggleAuto': S.flags.autobuyOff = !S.flags.autobuyOff; haptic.light(); Sound.play('click'); render(); break;
  }
});
function dismissModal() {
  if (!modalKind || modalKind === 'locked') return;
  const wasSettings = modalKind === 'settings'; closeModal(); if (wasSettings) save();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') dismissModal(); });
$('overlay').addEventListener('click', e => {
  if (e.target === $('overlay') && modalKind === 'locked') return;
  if (e.target === $('overlay')) { const wasSettings = modalKind === 'settings'; closeModal(); if (wasSettings) save(); }
});
// Звук разблокируется первым касанием
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });

/* ---------- Плавный счётчик в шапке ----------
   Каждый кадр показываем «живое» значение: сохранённое + доход с последнего тика.
   Траты и крупные начисления (офлайн, импорт) докручиваются за доли секунды. */
let curRate = 0, curSRate = 0, miniOn = false;
const shown = { docs: null, stamps: null };
let lastFrame = 0;
function easeTo(cur, target, rate, dt) {
  if (cur == null || !S.settings.animations) return target;
  const diff = target - cur;
  if (diff >= 0 && diff <= rate * 0.6 + CONFIG.manualSignAmount + 1e-9) return target;  // обычный рост и ручная подпись — сразу
  if (Math.abs(diff) <= Math.max(0.05, Math.abs(target) * 5e-4)) return target;          // разница уже не видна — дотягиваем
  const k = Math.min(1, dt * 12);
  // Разница в разы (реорганизация, крупная трата, большой офлайн-доход):
  // крутим по порядкам величины, иначе 30T → 5B тянулось бы секунду с лишним
  if (cur > 0 && target > 0 && (cur / target > 2 || target / cur > 2)) return Math.exp(Math.log(cur) + (Math.log(target) - Math.log(cur)) * k);
  return cur + diff * k;                                                                  // трата или крупное начисление — докрутка
}
function frame(now) {
  if (S && !document.hidden) {
    const dt = Math.min(0.1, (now - (lastFrame || now)) / 1000);
    const since = Math.min(0.5, Math.max(0, (Date.now() - lastTick) / 1000));
    shown.docs = easeTo(shown.docs, S.docs + curRate * since, curRate, dt);
    const docsStr = fmtPrecise(shown.docs);
    setText($('docs'), docsStr);
    if (miniOn) setText($('miniDocs'), docsStr);
    if (modalKind === 'inbox') updateInboxTimer(dt);
    if (curSRate > 0 || S.stamps > 0) {
      shown.stamps = easeTo(shown.stamps, S.stamps + curSRate * since, curSRate, dt);
      setText($('stamps'), fmtPrecise(shown.stamps));
      if (miniOn) setText($('miniStamps'), fmt(shown.stamps));
    } else shown.stamps = null;   // печатей нет (например, после реструктуризации) — потом счёт начнётся без докрутки
  }
  lastFrame = now;
  requestAnimationFrame(frame);
}

/* ---------- Удержание кнопки покупки отдела ----------
   Короткое нажатие — одна покупка (обычный click).
   Удержание дольше 0.35 с — покупка повторяется всё быстрее, пока хватает документов.
   Если палец сдвинулся (прокрутка) — удержание отменяется. */
const HOLD = { delay: 350, first: 160, min: 45, accel: 0.86 };
const hold = { id: null, timer: 0, rep: 0, step: 0, fired: false, x: 0, y: 0, btn: null };
function stopHold() {
  clearTimeout(hold.timer); clearTimeout(hold.rep);
  if (hold.btn) hold.btn.classList.remove('holding');
  hold.id = null; hold.btn = null;
}
function holdStep() {
  if (!hold.id) return;
  if (!onBuyDept(hold.id)) { stopHold(); return; }
  const card = $('d-' + hold.id);
  hold.btn = card ? card.querySelector('[data-act="buyDept"]') : null;
  if (hold.btn) hold.btn.classList.add('holding');
  hold.step = Math.max(HOLD.min, hold.step * HOLD.accel);
  hold.rep = setTimeout(holdStep, hold.step);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-act="buyDept"]');
  hold.fired = false;
  if (!b || b.disabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
  stopHold();
  hold.id = b.dataset.id; hold.x = e.clientX; hold.y = e.clientY;
  hold.timer = setTimeout(() => { hold.fired = true; hold.step = HOLD.first; holdStep(); }, HOLD.delay);
});
document.addEventListener('pointermove', e => {
  if (hold.id && !hold.fired && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 10) stopHold();
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, stopHold));
window.addEventListener('blur', stopHold);
document.addEventListener('contextmenu', e => { if (e.target.closest('.btn')) e.preventDefault(); });

/* ---------- Мини-баланс сверху при прокрутке ---------- */
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([en]) => {
    miniOn = !en.isIntersecting;
    document.body.classList.toggle('mini-on', miniOn);
    $('mini').setAttribute('aria-hidden', String(!miniOn));
    $('mini').inert = !miniOn;   // скрытые кнопки не ловят Tab и клики
  }, { threshold: 0 }).observe($('docs'));
}

/* ---------- Сохранение ---------- */
function save() { if (!S || Tabs.asleep) return; S.lastSeen = Date.now(); Store.save(S); }

// Автосохранение: сначала сверяемся с облаком, потом пишем
async function persist() {
  if (!S || Tabs.asleep) return;
  const firstRead = Store.cloud && !Store.everRead;   // облако не ответило на старте и отвечает только сейчас
  const remote = await Store.sync();
  if (remote) adoptSave(remote, firstRead ? t('tCloudRestored') : t('tSynced'));
  save();
}

// Подхватить сохранение из облака (с другого устройства или после медленного старта).
// Настройки этого устройства (язык, звук…) остаются свои.
/* ---------- Игра открыта в нескольких вкладках ----------
   В браузере сохранение одно на все вкладки. Без присмотра забытая старая вкладка
   при автосохранении затёрла бы прогресс новой. Поэтому дела ведутся в одной вкладке:
   новая (или та, где нажали «Играть здесь») становится главной, остальные сохраняются,
   передают ей своё состояние и засыпают — ничего не считают и не пишут. */
const Tabs = {
  ch: null,
  asleep: false,
  claimedAt: 0,
  init() {
    if (!('BroadcastChannel' in window)) return;
    try { this.ch = new BroadcastChannel('paperwork_inc_tabs'); } catch (e) { return; }
    this.ch.onmessage = e => {
      const d = e.data || {};
      if (d.sid === SID) return;
      if (d.type === 'active') this.sleep();
      // другая вкладка уступила место и прислала своё свежее состояние — продолжаем с него
      else if (d.type === 'yield' && d.save && Date.now() - this.claimedAt < 3000) {
        try { adoptSave(JSON.parse(d.save), t('tTabSynced')); } catch (err) {}
      }
    };
    this.claim();
  },
  post(msg) { try { this.ch && this.ch.postMessage(Object.assign({ sid: SID }, msg)); } catch (e) {} },
  claim() { this.claimedAt = Date.now(); this.post({ type: 'active' }); },
  sleep() {
    if (this.asleep || !S) return;
    save();                                         // последнее слово этой вкладки
    this.post({ type: 'yield', save: JSON.stringify(S) });
    this.asleep = true;
    stopHold();
    showModal({ form: t('tabsForm'), title: '🗂️ ' + t('tabsTitle'), body: `<p>${t('tabsBody')}</p>`,
      buttons: [{ label: t('tabsBtn'), onClick: () => this.wake() }] });
    modalKind = 'locked';                           // такое окно не закрывается мимо кнопки
  },
  wake() {
    this.asleep = false;
    // пока мы спали, другая вкладка могла поиграть и закрыться — берём её последнее сохранение
    const local = Store.readLocal();
    if (local && local.sid !== SID) adoptSave(local, t('tTabSynced'));
    else { lastTick = Date.now(); render(); }
    this.claim();
  },
};

function adoptSave(raw, message) {
  const next = migrate(raw);
  if (!next) return;
  next.settings = Object.assign({}, S.settings);
  S = next;
  if (modalKind) closeModal();
  activeTab = 'depts';
  applySettings();
  const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
  if (away >= CONFIG.offline.minAwaySec) applyAway(away);
  else if (away > 0) { advance(S, away, 1); inboxAccrue(away); }
  checkUnlocks(true);
  ensureDaily();
  inboxResult = null;
  lastTick = Date.now();
  S.lastSeen = lastTick;
  shown.docs = shown.stamps = null;   // счётчик в шапке — сразу к новому значению
  syncBuyMode();
  render();
  toast(message);
}

/* ---------- Игровой цикл ---------- */
function tick() {
  if (!S || document.hidden) return;
  if (Tabs.asleep) { lastTick = Date.now(); return; }   // спящая вкладка не считает   // в фоне не считаем: при возврате сработает офлайн-логика
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt <= 0) return;
  if (dt >= CONFIG.offline.minAwaySec) applyAway(dt);
  else { advance(S, dt, 1); S.stats.playSec += dt; autoBuy(dt, getMods(S)); inboxAccrue(dt); }
  S.lastSeen = now;
  checkUnlocks(false);
  ensureDaily();
  checkAchievements();
  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    Sound.syncAmbience();
    if (Sound.ctx && Sound.ctx.state === 'running') Sound.ctx.suspend();
  } else {
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume().then(() => Sound.syncAmbience(), () => {});
    tick();
    // пока мы были в фоне, могли поиграть на другом устройстве: до сверки в облако не пишем
    if (Store.cloud) { Store.writable = false; persist(); }
  }
});
window.addEventListener('pagehide', save);

/* ---------- Ротация служебных записок ---------- */
function rotateMemo() {
  if (!S || !S.settings.memos) return;
  const el = $('memo');
  el.classList.add('fade');
  setTimeout(() => { el.textContent = nextMemo(); el.classList.remove('fade'); }, 400);
}

/* ---------- Старт ---------- */
(async function start() {
  if (Store.cloud) { LANG = detectLang(); $('memo').textContent = t('loadingCloud'); }
  const saved = migrate(await Store.load());
  if (saved) {
    S = saved;
    S.stats.sessions++;
    LANG = S.settings.lang; NUMFMT = S.settings.numFormat;
    applySettings();
    const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
    if (away >= CONFIG.offline.minAwaySec) applyAway(away);
    else if (away > 0) { advance(S, away, 1); inboxAccrue(away); }
    checkUnlocks(true);
    ensureDaily();
  } else {
    S = ensureSettings(freshState());
    LANG = S.settings.lang;
    applySettings();
    showIntro();
  }
  $('memo').textContent = nextMemo();
  lastTick = Date.now();
  S.lastSeen = lastTick;
  syncBuyMode();
  render();
  if (Fullscreen.inTg && S.settings.fullscreen) Fullscreen.set(true);
  setInterval(tick, CONFIG.tickMs);
  requestAnimationFrame(frame);
  setInterval(persist, CONFIG.saveIntervalMs);
  setInterval(rotateMemo, 15000);
  Tabs.init();
})();
</script>
</body>
