<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paperwork Inc.</title>
<!-- Единственная внешняя зависимость: SDK Telegram Mini Apps -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   ЦВЕТА: берём из темы Telegram (--tg-theme-*), с запасными
   значениями «бумажной» палитры для обычного браузера
   ============================================================ */
:root{
  --bg: var(--tg-theme-secondary-bg-color, #ebe5d3);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fbf8ee));
  --text: var(--tg-theme-text-color, #23211c);
  --hint: var(--tg-theme-hint-color, #80796a);
  --accent: var(--tg-theme-button-color, #2f5d8a);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, #2f5d8a);
  --ink: var(--tg-theme-destructive-text-color, #b3261e);
  --line: rgba(127,127,127,.25);
  --line-strong: rgba(127,127,127,.45);
  --rule: rgba(90,130,190,.10);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Courier New", monospace;
}
/* Вне Telegram — собственная палитра (светлая и тёмная) */
html.no-tg{
  --bg:#ebe5d3; --card:#fbf8ee; --text:#23211c; --hint:#80796a;
  --accent:#2f5d8a; --accent-text:#fff; --link:#2f5d8a; --ink:#b3261e;
}
@media (prefers-color-scheme: dark){
  html.no-tg{
    --bg:#16181c; --card:#212429; --text:#e9e6dd; --hint:#8d8a82;
    --accent:#5b8fc7; --accent-text:#fff; --link:#7fb0e6; --ink:#e5534b;
    --rule: rgba(120,160,220,.07);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{color:var(--hint)}
.wrap{max-width:520px;margin:0 auto;padding:10px 12px calc(28px + env(safe-area-inset-bottom))}
/* Настройка «Анимации печатей: выкл» */
html.no-anim *, html.no-anim *::before, html.no-anim *::after{animation:none!important;transition:none!important}
html.no-anim .stamp-anim, html.no-anim .float-num{display:none}

/* ---------- Шапка-бланк ---------- */
.hdr{
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  padding:12px 14px 12px; position:relative; overflow:hidden;
  background-image:repeating-linear-gradient(to bottom, transparent 0 23px, var(--rule) 23px 24px);
}
.hdr::after{ /* красная «линия полей» как на бланке */
  content:""; position:absolute; top:0; bottom:0; left:8px; width:1px; background:var(--ink); opacity:.35;
}
.hdr-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hint);position:relative;z-index:1}
.hdr-right{display:flex;align-items:center;gap:8px}
.brand{font-weight:800;color:var(--text);letter-spacing:.16em}
.gear{
  border:1px solid var(--line-strong); background:var(--card); border-radius:6px;
  width:32px; height:30px; font-size:16px; line-height:1; padding:0;
}
.gear:active{transform:scale(.94)}
.docs{font-size:40px;font-weight:700;margin-top:6px;line-height:1.1;letter-spacing:-.01em}
.docs-label{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.1em}
.rate{font-size:15px;color:var(--link);margin-top:4px}
.subres{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.seal{
  position:absolute; right:12px; top:42px; transform:rotate(-14deg);
  border:3px double var(--ink); color:var(--ink); border-radius:50%;
  width:78px; height:78px; display:flex; align-items:center; justify-content:center; text-align:center;
  font:800 10px/1.15 var(--mono); letter-spacing:.08em; opacity:.33; pointer-events:none;
}
.sign{
  display:block; width:100%; margin-top:12px; padding:13px; border-radius:6px;
  border:0; background:var(--accent); color:var(--accent-text); font-weight:700; font-size:16px;
  position:relative;
}
.sign:active{transform:scale(.98)}
.sign.minor{
  width:auto; margin:8px 0 0 auto; padding:4px 10px; font-size:12px; font-weight:500;
  background:transparent; color:var(--hint); border:1px dashed var(--line-strong);
}
.float-num{
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  font:700 14px var(--mono); color:var(--ink); pointer-events:none; animation:floatUp .8s ease-out forwards;
}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}

/* ---------- Строка служебной записки ---------- */
.memo{margin:8px 2px 0; font:12px/1.35 var(--mono); color:var(--hint); min-height:32px; transition:opacity .4s}
.memo.fade{opacity:0}

/* ---------- Вкладки-папки ---------- */
.tabs{
  position:sticky; top:0; z-index:5; display:flex; gap:4px; padding:8px 0 0;
  background:var(--bg); border-bottom:1px solid var(--line-strong); margin-top:4px;
}
.tab{
  flex:1 1 auto; border:1px solid var(--line-strong); border-bottom:0; border-radius:8px 8px 0 0;
  background:transparent; padding:9px 6px 8px; font-size:13px; font-weight:600; color:var(--hint);
  position:relative; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tab.active{background:var(--card);color:var(--text);margin-bottom:-1px}
html[lang=ru] .tab{font-size:12.5px;padding-left:4px;padding-right:4px}
@media (max-width:370px){.tab{font-size:12px}.tab .t-ico{display:none}}
.tab:disabled{opacity:.45;cursor:default}
.badge{
  display:inline-block; min-width:16px; height:16px; padding:0 4px; margin-left:4px; border-radius:8px;
  background:var(--ink); color:#fff; font:700 10px/16px var(--mono); vertical-align:1px;
}
.panel{display:none;padding-top:10px}
.panel.active{display:block}

/* ---------- Карточки ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  padding:11px 12px 12px 18px; margin-bottom:9px; position:relative; overflow:hidden;
}
.card::before{content:"";position:absolute;top:0;bottom:0;left:9px;width:1px;background:var(--ink);opacity:.3}
.c-head{display:flex;align-items:center;gap:10px}
.c-emoji{font-size:26px;width:34px;text-align:center;flex:none}
.c-title{flex:1;min-width:0}
.c-name{font-weight:700;font-size:15px;line-height:1.2}
.c-form{font-size:10.5px;color:var(--hint);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.c-owned{font-size:20px;font-weight:700}
.c-desc{font-size:13px;color:var(--hint);margin:6px 0 6px;font-style:italic}
.c-stats{font-size:12px;margin-bottom:6px}
.effect{font-size:12px;color:var(--link);margin-bottom:8px}
.ms{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--hint);margin-bottom:8px}
.ms-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.ms-bar i{display:block;height:100%;width:0;background:var(--link);transition:width .25s}

.btn{
  display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%;
  border:1px solid transparent; border-radius:6px; padding:10px 12px;
  background:var(--accent); color:var(--accent-text); font-weight:600; font-size:14px; text-align:left;
}
.btn .sub{font-size:13px;font-weight:600;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{background:transparent;color:var(--hint);border:1px dashed var(--line-strong);cursor:default}
.btn.danger{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong)}

.redacted .c-name .rbar{background:var(--text);color:transparent;border-radius:2px;padding:0 4px}
.redacted{opacity:.75}

/* Анимация печати «APPROVED» при покупке */
.stamp-anim{
  position:absolute; right:14px; top:12px; border:3px solid var(--ink); color:var(--ink);
  font:800 13px var(--mono); padding:2px 8px; border-radius:4px; letter-spacing:.12em;
  pointer-events:none; animation:stampIn 1s ease-out forwards;
}
@keyframes stampIn{
  0%{transform:rotate(-12deg) scale(2.3);opacity:0}
  18%{transform:rotate(-12deg) scale(1);opacity:.95}
  70%{opacity:.85}
  100%{transform:rotate(-12deg) scale(1);opacity:0}
}

/* Переключатель количества покупки */
.po{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--hint);letter-spacing:.08em;text-transform:uppercase;margin:0 2px 9px}
.po .sp{flex:1}
.po button{
  border:1px solid var(--line-strong); background:transparent; border-radius:4px;
  padding:4px 9px; font:600 12px var(--mono); color:var(--hint);
}
.po button.on{background:var(--text);color:var(--card);border-color:var(--text)}

.empty{text-align:center;color:var(--hint);font-size:13px;padding:24px 10px;font-style:italic}
details.filed{margin-top:6px}
details.filed summary{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;padding:8px 2px;cursor:pointer}
.filed-row{font-size:13px;padding:6px 2px;border-bottom:1px dashed var(--line)}
.filed-row .mono{font-size:11.5px;color:var(--link)}

/* Реорганизация */
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.big-gain{font:700 28px var(--mono);color:var(--ink);text-align:center;margin:10px 0 2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--ink);width:0}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hint);margin:16px 2px 8px}

/* ---------- Модальное окно ---------- */
.overlay{
  position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5);
  display:none; align-items:flex-end; justify-content:center; padding:12px;
}
.overlay.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%; max-width:480px; max-height:88vh; overflow:auto; background:var(--card); color:var(--text);
  border-radius:10px; padding:18px 18px calc(16px + env(safe-area-inset-bottom)); position:relative;
  background-image:repeating-linear-gradient(to bottom, transparent 0 23px, var(--rule) 23px 24px);
  animation:slideUp .25s ease-out; overscroll-behavior:contain;
}
@keyframes slideUp{from{transform:translateY(30px)}to{transform:none}}
.sheet .m-form{font:11px var(--mono);color:var(--hint);letter-spacing:.1em;text-transform:uppercase}
.sheet h2{margin:4px 0 10px;font-size:20px}
.sheet.stamped .m-form,.sheet.stamped h2{padding-right:118px}
.sheet .m-body{font-size:14.5px}
.sheet .m-body p{margin:0 0 10px}
.sheet .m-joke{font-style:italic;color:var(--hint);border-left:2px solid var(--ink);padding:2px 0 2px 10px;margin:12px 0}
.sheet .m-stamp{
  position:absolute; right:16px; top:16px; transform:rotate(10deg);
  border:3px solid var(--ink); color:var(--ink); padding:3px 9px; border-radius:4px;
  font:800 13px var(--mono); letter-spacing:.12em; opacity:.8;
}
.m-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.m-btns .btn{justify-content:center}
textarea.code{
  width:100%; height:110px; resize:none; font:11px/1.35 var(--mono); word-break:break-all;
  background:var(--bg); color:var(--text); border:1px solid var(--line-strong); border-radius:6px; padding:8px;
  -webkit-user-select:text; user-select:text;
}

/* ---------- Окно настроек ---------- */
.set-sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hint);margin:16px 0 2px}
.set-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.set-label small{display:block;font-size:11.5px;color:var(--hint)}
.switch{
  width:46px; height:26px; border-radius:13px; border:0; padding:0; flex:none;
  background:var(--line-strong); position:relative; transition:background .15s;
}
.switch::after{
  content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;
}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--hint)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--text);color:var(--card)}
input.vol{width:150px;accent-color:var(--accent)}
input.vol:disabled{opacity:.4}
.btn-row{display:flex;gap:8px}
.btn-row .btn{justify-content:center;font-size:13px}
.credit{text-align:center;font-size:11px;color:var(--hint);margin-top:16px;letter-spacing:.04em}

/* ---------- Тост ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:30;
  transform:translateX(-50%) translateY(20px); opacity:0; transition:all .3s;
  background:var(--text); color:var(--card); padding:10px 14px; border-radius:8px;
  font-size:13px; max-width:92vw; width:max-content; box-shadow:0 6px 20px rgba(0,0,0,.25); pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <!-- Шапка: главные цифры -->
  <header class="hdr">
    <div class="seal">PAPER<br>WORK<br>INC.</div>
    <div class="hdr-top">
      <span class="brand">Paperwork Inc.</span>
      <span class="hdr-right"><span class="mono" data-i18n="ledger"></span><button class="gear" data-act="settings" aria-label="Settings">⚙️</button></span>
    </div>
    <div class="docs mono" id="docs">0</div>
    <div class="docs-label" data-i18n="docsLabel"></div>
    <div class="rate mono" id="rate">+0</div>
    <div class="subres">
      <span id="stampsLine" hidden>🔏 <b class="mono" id="stamps">0</b> <span data-i18n="stampsWord"></span> <span class="mono hint" id="stampRate"></span></span>
      <span id="senLine" hidden>🎖️ <span data-i18n="seniority"></span> <b class="mono" id="sen">0</b> <span class="mono hint" id="senBonus"></span></span>
    </div>
    <button class="sign" id="signBtn" data-act="sign">✍️ <span data-i18n="sign"></span> <span class="mono">(+1)</span></button>
  </header>

  <div class="memo" id="memo"></div>

  <!-- Вкладки -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-act="tab" data-id="depts"><span class="t-ico">🗄️</span> <span data-i18n="tabDepts"></span></button>
    <button class="tab" data-act="tab" data-id="upgs"><span class="t-ico">📎</span> <span data-i18n="tabUpgs"></span><span class="badge" id="upgBadge" hidden></span></button>
    <button class="tab" data-act="tab" data-id="restr"><span class="t-ico">🔄</span> <span data-i18n="tabRestr"></span></button>
  </nav>

  <!-- Отделы -->
  <section class="panel active" id="p-depts">
    <div class="po"><span data-i18n="purchaseOrder"></span><span class="sp"></span>
      <button data-act="mode" data-id="1">×1</button>
      <button data-act="mode" data-id="10">×10</button>
      <button data-act="mode" data-id="max">MAX</button>
    </div>
    <div id="deptList"></div>
  </section>

  <!-- Улучшения -->
  <section class="panel" id="p-upgs">
    <div id="upgList"></div>
    <div id="upgFiled"></div>
  </section>

  <!-- Реорганизация -->
  <section class="panel" id="p-restr">
    <div class="card">
      <div class="c-head"><span class="c-emoji">🔄</span><div class="c-title">
        <div class="c-name" data-i18n="rTitle"></div>
        <div class="c-form mono" data-i18n="rForm"></div></div></div>
      <div class="c-desc" id="rDesc"></div>
      <div class="kv"><span data-i18n="rSenL"></span><b id="rSen">0</b></div>
      <div class="kv"><span data-i18n="rBonusL"></span><b id="rBonus">+0%</b></div>
      <div class="kv"><span data-i18n="rRunL"></span><b id="rRun">0</b></div>
      <div class="kv"><span data-i18n="rAllL"></span><b id="rAll">0</b></div>
      <div class="kv"><span data-i18n="rNextL"></span><b id="rNext">0</b></div>
      <div class="big-gain" id="rGain">+0</div>
      <div class="hint" style="text-align:center;font-size:12px" data-i18n="rGainHint"></div>
      <div class="section-title" data-i18n="rMinOutput"></div>
      <div class="progress"><i id="rProg"></i></div>
      <div class="mono hint" style="font-size:12px;margin-bottom:12px" id="rProgText"></div>
      <button class="btn" id="rBtn" data-act="restructure"><span></span><span class="sub">🔄</span></button>
    </div>
    <div class="section-title" data-i18n="recordsTitle"></div>
    <div class="card">
      <div class="kv"><span data-i18n="rCountL"></span><b id="rCount">0</b></div>
      <div class="kv"><span data-i18n="rCapL"></span><b id="rCap">8h</b></div>
      <div class="kv"><span data-i18n="rEffL"></span><b id="rEff">50%</b></div>
      <div class="kv"><span data-i18n="rOwnedL"></span><b id="rOwned">0</b></div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   PAPERWORK INC. — idle-игра для Telegram Mini App
   Всё, что касается баланса и текстов, лежит в начале скрипта:
     CONFIG, DEPARTMENTS, UPGRADES — баланс (и английские названия)
     I18N — все тексты интерфейса на английском и русском
     DEFAULT_SETTINGS — настройки по умолчанию
     SFX — рецепты звуков
   Блок между маркерами ENGINE — чистая логика без DOM
   (её же можно прогнать в Node для проверки баланса).
   ВАЖНО для обновлений: не меняйте id отделов/апгрейдов и SAVE_KEY —
   иначе у игроков пропадёт прогресс.
   ===================================================================== */

// ===== ENGINE START =====

/* ---------- Основные настройки баланса ---------- */
const CONFIG = {
  version: '1.2',              // версия игры (показывается в настройках)
  costGrowth: 1.15,            // рост цены отдела: база × 1.15^количество
  manualSignAmount: 1,         // сколько даёт кнопка «Sign manually»
  tickMs: 250,                 // частота обновления экрана
  saveIntervalMs: 10000,       // автосохранение каждые 10 секунд
  offline: {
    baseCapHours: 8,           // лимит офлайна на старте
    baseEfficiency: 0.5,       // доля дохода, начисляемая офлайн (апгрейды поднимают до 100%)
    minAwaySec: 60,            // после какого отсутствия показывать окно «пока вас не было»
  },
  stamps: {
    perDepartmentPerSec: 0.003, // каждый купленный отдел ставит 0.003 печати в секунду
  },
  milestones: { every: 25, mult: 2 },     // каждые 25 штук отдела — выход ×2
  reveal: {
    deptAtFraction: 0.25,      // отдел показывается, когда заработано 25% его цены
    upgradeAtFraction: 0.3,    // апгрейд показывается, когда заработано 30% его цены
  },
  unlocks: {
    upgradesTabEarned: 500,     // заработано за период → открывается вкладка Upgrades
    restructureTabEarned: 1e5,  // → открывается вкладка Restructuring (превью)
  },
  prestige: {
    minRunEarned: 3e11,        // минимум заработанного за период для реструктуризации
    divisor: 5e9,              // Seniority = floor(sqrt(всего_заработано / divisor))
    bonusPerPoint: 0.10,       // +10% к доходу за каждую единицу Seniority
  },
};

/* ---------- Отделы (генераторы) ---------- */
const DEPARTMENTS = [
  { id:'intern', emoji:'🪑', name:"Intern's Desk", form:'Form 10-A', baseCost:10, baseProd:0.2,
    desc:"One desk, one intern, one pen on a chain. Signs anything placed in front of it." },

/* ---------- Справочники ---------- */
const DEPT_BY_ID = Object.fromEntries(DEPARTMENTS.map(d => [d.id, d]));
const UPG_BY_ID = Object.fromEntries(UPGRADES.map(u => [u.id, u]));

/* ---------- Состояние игры ---------- */
// prev — предыдущее состояние, если делаем реструктуризацию (сохраняем престиж)
function freshState(prev) {
  const now = Date.now();
  return {
    v: 1,
    docs: 0, stamps: 0,
    runEarned: 0,            // заработано за текущий «финансовый период» (до реструктуризации)
    stampsEarnedRun: 0,
    allTimeEarned: prev ? prev.allTimeEarned : 0,
    seniority: prev ? prev.seniority : 0,
    restructures: prev ? prev.restructures : 0,
    depts: {}, upgrades: [],
    flags: prev ? Object.assign({}, prev.flags) : {},
    buyMode: prev ? prev.buyMode : 1,
    created: prev ? prev.created : now,
    runStarted: now,
    lastSeen: now,
    settings: prev && prev.settings ? Object.assign({}, prev.settings) : null, // настройки переживают реорганизацию
    stats: prev && prev.stats ? Object.assign({}, prev.stats) : null,          // как и личное дело
  };
}
const owned = (s, id) => s.depts[id] || 0;
const hasUpg = (s, id) => s.upgrades.indexOf(id) !== -1;
function totalOwned(s) { let t = 0; for (const k in s.depts) t += s.depts[k]; return t; }

// Собираем все модификаторы от купленных апгрейдов и престижа
function getMods(s) {
  const m = {
    dept: {}, global: 1, cost: 1,
    capHours: CONFIG.offline.baseCapHours, eff: CONFIG.offline.baseEfficiency,
    stampsOn: false, stampMult: 1, senPer: CONFIG.prestige.bonusPerPoint,
  };
  for (const d of DEPARTMENTS) m.dept[d.id] = 1;
  for (const id of s.upgrades) {
    const u = UPG_BY_ID[id]; if (!u) continue;
    const e = u.effect;
    if (e.type === 'dept') m.dept[e.dept] *= e.mult;
    else if (e.type === 'global') m.global *= e.mult;
    else if (e.type === 'cost') m.cost *= e.mult;
    else if (e.type === 'offlineCap') m.capHours += e.hours;
    else if (e.type === 'offlineEff') m.eff += e.add;
    else if (e.type === 'unlockStamps') m.stampsOn = true;
    else if (e.type === 'stampMult') m.stampMult *= e.mult;
    else if (e.type === 'seniority') m.senPer += e.add;
  }
  m.eff = Math.min(1, m.eff);
  m.senMult = 1 + s.seniority * m.senPer;
  return m;
}

// Множитель за «вехи»: каждые 25 штук — ×2
function milestoneMult(c) { return Math.pow(CONFIG.milestones.mult, Math.floor(c / CONFIG.milestones.every)); }
function deptRateAt(d, c, m) { return d.baseProd * c * m.dept[d.id] * milestoneMult(c) * m.global * m.senMult; }
function deptRate(s, d, m) { return deptRateAt(d, owned(s, d.id), m); }
function totalRate(s, m) { m = m || getMods(s); let r = 0; for (const d of DEPARTMENTS) r += deptRate(s, d, m); return r; }
function stampRate(s, m) {
  m = m || getMods(s);
  return m.stampsOn ? CONFIG.stamps.perDepartmentPerSec * totalOwned(s) * m.stampMult : 0;
}

// Цена n штук отдела (сумма геометрической прогрессии)
function deptCost(s, d, n, m) {
  const g = CONFIG.costGrowth, c = owned(s, d.id);
  return d.baseCost * m.cost * Math.pow(g, c) * (Math.pow(g, n) - 1) / (g - 1);
}
// Сколько штук можно купить прямо сейчас
function maxBuy(s, d, m) {
  const g = CONFIG.costGrowth;
  const first = d.baseCost * m.cost * Math.pow(g, owned(s, d.id));
  if (s.docs < first) return 0;
  let k = Math.max(1, Math.floor(Math.log(s.docs * (g - 1) / first + 1) / Math.log(g)));
  while (k > 1 && deptCost(s, d, k, m) > s.docs) k--; // защита от погрешности
  return k;
}

function upgradesUnlocked(s) { return !!s.flags.upgradesTab || s.runEarned >= CONFIG.unlocks.upgradesTabEarned || s.restructures > 0; }
function restructureUnlocked(s) { return !!s.flags.restructureTab || s.runEarned >= CONFIG.unlocks.restructureTabEarned || s.restructures > 0; }
function deptVisible(s, d, i) { return i === 0 || owned(s, d.id) > 0 || s.runEarned >= d.baseCost * CONFIG.reveal.deptAtFraction; }

function reqMet(s, u) {
  const r = u.req || {};
  if (r.dept && owned(s, r.dept) < r.count) return false;
  if (r.upgrade && !hasUpg(s, r.upgrade)) return false;
  if (r.earned && s.runEarned < r.earned) return false;
  if (r.restructures && s.restructures < r.restructures) return false;
  return true;
}
// Показываем только купленные или «почти доступные» апгрейды
function upgVisible(s, u, m) {
  if (hasUpg(s, u.id)) return true;
  if (!upgradesUnlocked(s) || !reqMet(s, u)) return false;
  if (u.currency === 'stamps') return m.stampsOn && s.stampsEarnedRun >= u.cost * CONFIG.reveal.upgradeAtFraction;
  return s.runEarned >= u.cost * CONFIG.reveal.upgradeAtFraction;
}
function canAfford(s, u) { return u.currency === 'stamps' ? s.stamps >= u.cost : s.docs >= u.cost; }

function buyDept(s, id, n) {
  const d = DEPT_BY_ID[id], m = getMods(s);
  if (!d || n < 1) return false;
  const c = deptCost(s, d, n, m);
  if (c > s.docs * (1 + 1e-12)) return false;
  s.docs = Math.max(0, s.docs - c);
  s.depts[id] = owned(s, id) + n;
  return true;
}
function buyUpgrade(s, id) {
  const u = UPG_BY_ID[id], m = getMods(s);
  if (!u || hasUpg(s, id) || !upgVisible(s, u, m) || !canAfford(s, u)) return false;
  if (u.currency === 'stamps') s.stamps = Math.max(0, s.stamps - u.cost);
  else s.docs = Math.max(0, s.docs - u.cost);
  s.upgrades.push(id);
  return true;
}

// Начисление дохода за sec секунд с эффективностью eff (1 = онлайн)
function advance(s, sec, eff) {
  if (eff == null) eff = 1;
  const m = getMods(s);
  const d = totalRate(s, m) * sec * eff;
  const st = stampRate(s, m) * sec * eff;
  s.docs += d; s.runEarned += d; s.allTimeEarned += d;
  s.stamps += st; s.stampsEarnedRun += st;
  return { docs: d, stamps: st };
}

/* ---------- Престиж ---------- */
function seniorityTotalFor(allTime) { return Math.floor(Math.sqrt(allTime / CONFIG.prestige.divisor)); }
function seniorityGain(s) { return Math.max(0, seniorityTotalFor(s.allTimeEarned) - s.seniority); }
function canRestructure(s) { return s.runEarned >= CONFIG.prestige.minRunEarned && seniorityGain(s) >= 1; }
function nextSeniorityAt(s) {
  const t = Math.max(seniorityTotalFor(s.allTimeEarned), s.seniority) + 1;
  return CONFIG.prestige.divisor * t * t;
}
function restructure(s) {
  const g = seniorityGain(s);
  const n = freshState(s);
  n.seniority = s.seniority + g;
  n.restructures = s.restructures + 1;
  return n;
}

   ===================================================================== */
const SFX = {
  // царапанье ручки — ручная подпись
  sign(A, t) {
    A.hiss(t, { dur: 0.06, gain: 0.12, freq: 3200, q: 3 });
    A.hiss(t + 0.07, { dur: 0.05, gain: 0.09, freq: 4200, q: 3 });
  },
  // удар резиновой печати — покупка отдела
  stamp(A, t) {
    A.tone(t, { freq: 150, freqEnd: 45, dur: 0.16, gain: 0.7, attack: 0.002 });
    A.hiss(t, { dur: 0.06, gain: 0.35, filter: 'lowpass', freq: 1200 });
    A.hiss(t, { dur: 0.015, gain: 0.12, filter: 'highpass', freq: 5000 });
  },
  // звонок на ресепшене — апгрейд
  upgrade(A, t) {
    A.hiss(t, { dur: 0.012, gain: 0.1, filter: 'highpass', freq: 6000 });
    A.tone(t, { freq: 1568, dur: 1.1, gain: 0.2 });
    A.tone(t, { freq: 1573, dur: 1.1, gain: 0.1 });
    A.tone(t, { freq: 3920, dur: 0.5, gain: 0.06 });
  },
  // кассовый аппарат — веха ×2 и доступность реорганизации
  milestone(A, t) {
    A.hiss(t, { dur: 0.05, gain: 0.3, freq: 1400, q: 1.5 });
    A.hiss(t + 0.05, { dur: 0.03, gain: 0.2, freq: 2600, q: 2 });
    [2093, 2637, 3136].forEach((f, i) => A.tone(t + 0.08 + i * 0.015, { freq: f, dur: 0.8, gain: 0.12 }));
  },
  // офисный телефон — открылся новый отдел или вкладка
  ring(A, t) {
    for (let b = 0; b < 2; b++)
      for (let i = 0; i < 9; i++)
        A.tone(t + b * 0.42 + i * 0.035, { freq: i % 2 ? 1040 : 880, type: 'triangle', dur: 0.04, gain: 0.08, attack: 0.003 });
  },
  // шелест бумаг и колокольчик — подтверждение акта об отсутствии
  welcome(A, t) {
    A.hiss(t, { dur: 0.22, gain: 0.25, freq: 900, freqEnd: 2800, q: 0.8 });
    A.hiss(t + 0.2, { dur: 0.25, gain: 0.22, freq: 1200, freqEnd: 3500, q: 0.8 });
    A.tone(t + 0.45, { freq: 1318, dur: 0.9, gain: 0.13 });
  },
  // шредер — реорганизация и полный сброс
  shredder(A, t) {
    const c = A.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), d = 1.4;
    o.type = 'sawtooth'; o.frequency.value = 75;
    f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.05);
    for (let k = 0.1; k < d - 0.1; k += 0.07) g.gain.setValueAtTime(0.1 + Math.random() * 0.1, t + k);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(f); f.connect(g); g.connect(A.master);
    o.start(t); o.stop(t + d + 0.05);
    A.hiss(t, { dur: d, gain: 0.16, freq: 1500, q: 0.7, attack: 0.05 });
  },
  // шорох листа — переключение вкладок
  tab(A, t) { A.hiss(t, { dur: 0.035, gain: 0.08, filter: 'highpass', freq: 2500 }); },
  // щелчок — переключатели
  click(A, t) { A.tone(t, { freq: 1200, type: 'square', dur: 0.025, gain: 0.035 }); },
};

  load() {

      let local = null;
      try { local = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
      if (!this.cloud) return resolve(local);
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; resolve(local); } }, 2500);
      try {
        tg.CloudStorage.getItem(SAVE_KEY, (err, val) => {
          if (done) return; done = true; clearTimeout(timer);
          let cloud = null;
          if (!err && val) { try { cloud = JSON.parse(val); } catch (e) {} }
          if (cloud && local) resolve((cloud.lastSeen || 0) >= (local.lastSeen || 0) ? cloud : local);

/* =====================================================================
   ЗВУКОВОЙ ДВИЖОК
   ===================================================================== */
const Sound = {
  ctx: null, master: null, noise: null, amb: null,
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    this.master = this.ctx.createGain();
    this.master.connect(this.ctx.destination);
    // 2 секунды белого шума — основа для шорохов, печатей и шредера
    const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.setVolume();
    return true;
  },
  // Браузеры разрешают звук только после касания — вызываем на каждое касание
  unlock() {
    if (!S || !S.settings.sound) return;
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.syncAmbience();
  },
  setVolume() { if (this.master && S) this.master.gain.value = S.settings.volume; },
  play(name) {
    if (!S || !S.settings.sound || document.hidden) return;
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const f = SFX[name];
    if (f) try { f(this, this.ctx.currentTime + 0.01); } catch (e) {}
  },
  tone(t, { freq, freqEnd, type = 'sine', dur = 0.2, gain = 0.3, attack = 0.005 }) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  hiss(t, { dur = 0.1, gain = 0.3, filter = 'bandpass', freq = 1000, freqEnd, q = 1, attack = 0.003 }) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise;
    f.type = filter;
    f.frequency.setValueAtTime(freq, t);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 1.5, dur + 0.1);
  },
  // Фоновый шум офиса: низкий гул + тиканье часов
  syncAmbience() {
    const want = !!(S && S.settings.sound && S.settings.ambience && !document.hidden && this.ctx && this.ctx.state === 'running');
    if (want && !this.amb) {
      const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = this.noise; src.loop = true;
      f.type = 'lowpass'; f.frequency.value = 220;
      g.gain.value = 0.05;
      src.connect(f); f.connect(g); g.connect(this.master); src.start();
      let tick = false;
      const timer = setInterval(() => {
        tick = !tick;
        try { this.tone(c.currentTime + 0.01, { freq: tick ? 2600 : 2200, dur: 0.012, gain: 0.025, attack: 0.001 }); } catch (e) {}
      }, 1000);
      this.amb = { src, timer };
    } else if (!want && this.amb) {
      try { this.amb.src.stop(); } catch (e) {}
      clearInterval(this.amb.timer);
      this.amb = null;
    }
  },
};

let LANG = 'en';
let NUMFMT = 'short';
function t(key, vars) {
  let s = I18N[LANG].ui[key];
  if (s == null) s = I18N.en.ui[key];
  if (s == null) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  return s;
}
const tlist = key => (I18N[LANG].lists && I18N[LANG].lists[key]) || I18N.en.lists[key];
const dName = d => ((I18N[LANG].depts || {})[d.id] || d).name;
const dDesc = d => ((I18N[LANG].depts || {})[d.id] || d).desc;
const uName = u => ((I18N[LANG].upgs || {})[u.id] || u).name;
const uDesc = u => ((I18N[LANG].upgs || {})[u.id] || u).desc;
const formStr = f => f.replace(/^Form/, t('form'));

function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 10) return (Math.floor(n * 10) / 10).toFixed(n % 1 === 0 ? 0 : 1);
  if (n < 1000) return String(Math.floor(n));
  if (NUMFMT === 'sci') return n.toExponential(2).replace('e+', 'e');
  const units = ['K', 'M', 'B', 'T'];
  const e = Math.floor(Math.log10(n) / 3);
  if (e > units.length) return n.toExponential(2).replace('e+', 'e');
  const v = n / Math.pow(1000, e);
  return (v < 100 ? (Math.floor(v * 10) / 10).toFixed(1) : String(Math.floor(v))) + units[e - 1];
}
// Формат с большей точностью для шапки: 1.234K, 12.34K, 123.4K — чтобы рост был виден
function fmtPrecise(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 ? (Math.floor(n * 10) / 10).toFixed(1) : String(Math.floor(n));
  if (NUMFMT === 'sci') return Number(n).toExponential(3).replace('e+', 'e');
  const units = ['K', 'M', 'B', 'T'];
  const e = Math.floor(Math.log10(n) / 3);
  if (e > units.length) return Number(n).toExponential(3).replace('e+', 'e');
  const v = n / Math.pow(1000, e);
  const dec = v < 10 ? 3 : v < 100 ? 2 : 1;
  const p = Math.pow(10, dec);
  return (Math.floor(v * p) / p).toFixed(dec) + units[e - 1];
}
function fmtRate(n) { return n > 0 && n < 10 ? (Math.round(n * 100) / 100).toString() : fmt(n); }
function fmtTime(sec) {
  if (!isFinite(sec)) return '∞';
  sec = Math.max(0, Math.ceil(sec));
  const pad = x => String(x).padStart(2, '0');
  if (sec < 60) return sec + t('tS');
  const m = Math.floor(sec / 60);
  if (m < 60) return m + t('tM') + ' ' + pad(sec % 60) + t('tS');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('tH') + ' ' + pad(m % 60) + t('tM');
  return Math.floor(h / 24) + t('tD') + ' ' + (h % 24) + t('tH');
}
const pct = x => Math.round(x * 100) + '%';
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const esc = str => String(str).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  S.settings[key] = b.dataset.val != null ? b.dataset.val : !S.settings[key];
  applySettings();
  Sound.play('click'); haptic.light();
  showSettings();
  save();
});
$('sheet').addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.set === 'volume') { S.settings.volume = +e.target.value / 100; Sound.setVolume(); }
});
$('sheet').addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.set === 'volume') { Sound.play('stamp'); save(); }
});

/* ---------- Экспорт и импорт сохранения ---------- */
const CODE_PREFIX = 'PWI1.';
function exportCode() { return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function parseCode(code) {
  code = String(code || '').trim().replace(/\s+/g, '');
  if (code.indexOf(CODE_PREFIX) !== 0) return null;
  try { return migrate(JSON.parse(decodeURIComponent(escape(atob(code.slice(CODE_PREFIX.length)))))); } catch (e) { return null; }
}
function showExport() {
  save();
  showModal({
    form: t('settingsForm'), title: '📤 ' + t('exportTitle'),
    body: `<p>${t('exportBody')}</p><textarea class="code" id="saveCode" readonly>${esc(exportCode())}</textarea>`,
    buttons: [
      { label: '📋 ' + t('copy'), keepOpen: true, onClick: copyCode },
      { label: t('back'), ghost: true, onClick: showSettings },
    ],
  });
}
function copyCode() {
  const ta = $('saveCode'); if (!ta) return;
  ta.focus(); ta.select();
  const fallback = () => { let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} toast(ok ? t('tCopied') : t('tCopyFail')); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => toast(t('tCopied')), fallback);
  else fallback();
}
function showImport() {
  showModal({
    form: t('settingsForm'), title: '📥 ' + t('importTitle'),
    body: `<p>${t('importBody')}</p><textarea class="code" id="saveCode" placeholder="PWI1.…"></textarea>`,
    buttons: [
      { label: t('importBtn'), keepOpen: true, onClick: () => {
          const next = parseCode($('saveCode').value);
          if (!next) { toast(t('tImportBad')); return; }
          next.settings = Object.assign({}, S.settings);   // настройки этого устройства сохраняем
          next.lastSeen = Date.now();                        // офлайн-доход за время в коде не начисляем
          S = next; closeModal();
          activeTab = 'depts'; applySettings(); save();
          Sound.play('upgrade'); haptic.success(); toast(t('tImported'));
        } },
      { label: t('back'), ghost: true, onClick: showSettings },
    ],
  });
}

/* ---------- Окно «пока вас не было» ---------- */
function showAway(awaySec, countedSec, gained, m) {
  const capped = awaySec > countedSec + 1;
  let body = '';
  if (gained.docs <= 0) {
    body = `<p>${t('awayQuiet', { t: fmtTime(awaySec) })}</p><div class="m-joke">${t('quietOffice')}</div>`;
  } else {
    body = `<p>${t('awayBody', { t: fmtTime(awaySec), d: fmt(gained.docs) })}` +
      (gained.stamps > 0 ? t('awayStamps', { s: fmt(gained.stamps) }) : '') + `.</p>` +
      `<p class="hint mono" style="font-size:12px">${t('awayEff', { e: pct(m.eff), h: m.capHours })}</p>` +
      (capped ? `<p style="font-size:13px">${t('awayCapped', { h: m.capHours })}</p>` : '') +
      `<div class="m-joke">${t('awayMeanwhile')} ${pick(tlist('jokes'))}</div>`;
  }
  showModal({ form: t('awayForm'), title: '📬 ' + t('awayTitle'), stamp: t('stampReceived'), body,
    buttons: [{ label: t('awayBtn'), onClick: () => Sound.play('welcome') }] });
  if (gained.docs > 0) haptic.success();
}

// Начисляем офлайн-доход с учётом лимита и эффективности
function applyAway(sec) {
  const m = getMods(S);
  const counted = Math.min(sec, m.capHours * 3600);
  const gained = advance(S, counted, m.eff);
  checkUnlocks(true);
  const mode = S.settings.awayReport;
  if (mode === 'always' || (mode === 'long' && sec >= 1800)) showAway(sec, counted, gained, m);
  else if (gained.docs > 0) toast(t('awayToast', { n: fmt(gained.docs) }));
}

/* ---------- Проверка открытия механик ---------- */
function checkUnlocks(silent) {
  const notify = (msg, sfx) => { if (silent) return; toast(msg); haptic.success(); Sound.play(sfx); };
  if (!S.flags.upgradesTab && upgradesUnlocked(S)) { S.flags.upgradesTab = true; notify(t('tUpgTab'), 'ring'); }
  if (!S.flags.restructureTab && restructureUnlocked(S)) { S.flags.restructureTab = true; notify(t('tRestrTab'), 'ring'); }
  DEPARTMENTS.forEach((d, i) => {
    const f = 'seen_' + d.id;
    if (i > 0 && !S.flags[f] && deptVisible(S, d, i)) { S.flags[f] = true; notify(t('tNewDept', { e: d.emoji, name: dName(d) }), 'ring'); }
  });
  if (canRestructure(S) && !S.flags['canR_' + S.restructures]) {
    S.flags['canR_' + S.restructures] = true; notify(t('tCanRestr'), 'milestone');
  }
}

/* ---------- Отделы ---------- */
function buildDepts() {
  const vis = []; let teaser = null;
  DEPARTMENTS.forEach((d, i) => { if (deptVisible(S, d, i)) vis.push(d); else if (!teaser) teaser = d; });
  const key = vis.map(d => d.id).join(',') + '|' + (teaser ? teaser.id : '');
  if (key === deptKey) return;
  deptKey = key;
  let html = vis.map(d => `
    <div class="card dept" id="d-${d.id}">
      <div class="c-head"><span class="c-emoji">${d.emoji}</span>
        <div class="c-title"><div class="c-name">${esc(dName(d))}</div><div class="c-form mono">${formStr(d.form)}</div></div>
        <div class="c-owned mono" data-f="owned"></div></div>
      <div class="c-desc">${esc(dDesc(d))}</div>
      <div class="c-stats mono" data-f="stats"></div>
      <div class="ms"><div class="ms-bar"><i data-f="bar"></i></div><span class="mono" data-f="ms"></span></div>
      <button class="btn" data-act="buyDept" data-id="${d.id}"><span data-f="bl"></span><span class="sub mono" data-f="bs"></span></button>
    </div>`).join('');
  if (teaser) html += `
    <div class="card redacted" id="d-teaser">
      <div class="c-head"><span class="c-emoji">🔒</span>
        <div class="c-title"><div class="c-name"><span class="rbar">${'X'.repeat(Math.min(24, dName(teaser).length))}</span></div>
        <div class="c-form mono">${t('classified')}</div></div></div>
      <div class="c-desc">${t('clearance', { n: fmt(teaser.baseCost * CONFIG.reveal.deptAtFraction) })}</div>
    </div>`;
  $('deptList').innerHTML = html;
}

function renderDepts(m, rate) {
  buildDepts();
  const every = CONFIG.milestones.every;
  for (const d of DEPARTMENTS) {
    const card = $('d-' + d.id); if (!card) continue;
    const c = owned(S, d.id);
    const f = name => card.querySelector('[data-f="' + name + '"]');
    f('owned').textContent = '×' + c;
    const total = deptRate(S, d, m);
    const each = c > 0 ? total / c : deptRateAt(d, 1, m);
    f('stats').textContent = c > 0
      ? t('each', { v: fmtRate(each) }) + ' · ' + t('total', { v: fmtRate(total) }) + (rate > 0 ? ` · ${Math.round(total / rate * 100)}%` : '')
      : t('each', { v: fmtRate(each) });
    const nextMs = (Math.floor(c / every) + 1) * every;
    f('bar').style.width = ((c % every) / every * 100) + '%';
    f('ms').textContent = t('milestone', { c, next: nextMs, m: CONFIG.milestones.mult });
    // кнопка покупки
    let n = S.buyMode === 'max' ? maxBuy(S, d, m) : S.buyMode;
    if (n < 1) n = 1;
    const cost = deptCost(S, d, n, m);
    const btn = card.querySelector('[data-act="buyDept"]');
    const ok = S.docs >= cost;
    btn.disabled = !ok;
    f('bl').textContent = ok ? t('acquire', { n }) : '⏳ ' + t('pending') + (rate > 0 ? ' · ' + fmtTime((cost - S.docs) / rate) : '');
    f('bs').textContent = '📄 ' + fmt(cost);
  }
  document.querySelectorAll('.po button').forEach(b => b.classList.toggle('on', String(S.buyMode) === b.dataset.id));
}

/* ---------- Улучшения ---------- */
function renderUpgrades(m, rate, sRate) {
  const avail = UPGRADES.filter(u => !hasUpg(S, u.id) && upgVisible(S, u, m))
    .sort((a, b) => (a.currency === b.currency ? a.cost - b.cost : a.currency === 'docs' ? -1 : 1));
  const key = avail.map(u => u.id).join(',');
  if (key !== upgKey) {
    upgKey = key;
    $('upgList').innerHTML = avail.length ? avail.map(u => `
      <div class="card upg" id="u-${u.id}">
        <div class="c-head"><span class="c-emoji">${u.emoji}</span>
          <div class="c-title"><div class="c-name">${esc(uName(u))}</div><div class="c-form mono">${upgForm(u)}</div></div></div>
        <div class="c-desc">${esc(uDesc(u))}</div>
        <div class="effect mono">▸ ${esc(effectText(u))}</div>
        <button class="btn" data-act="buyUpg" data-id="${u.id}"><span data-f="bl"></span><span class="sub mono" data-f="bs"></span></button>
      </div>`).join('') : `<div class="empty">${t('noUpgrades')}</div>`;
  }
  let affordable = 0;
  for (const u of avail) {
    const card = $('u-' + u.id); if (!card) continue;
    const have = u.currency === 'stamps' ? S.stamps : S.docs;
    const r = u.currency === 'stamps' ? sRate : rate;
    const ok = have >= u.cost; if (ok) affordable++;
    card.querySelector('[data-act="buyUpg"]').disabled = !ok;
    card.querySelector('[data-f="bl"]').textContent = ok ? t('approveReq') : '⏳ ' + t('pending') + (r > 0 ? ' · ' + fmtTime((u.cost - have) / r) : '');
    card.querySelector('[data-f="bs"]').textContent = curIcon(u) + ' ' + fmt(u.cost);
  }
  // Список купленных
  const fk = S.upgrades.join(',');
  if (fk !== filedKey) {
    filedKey = fk;
    const bought = S.upgrades.map(id => UPG_BY_ID[id]).filter(Boolean);
    $('upgFiled').innerHTML = bought.length ? `<details class="filed" ${filedOpen ? 'open' : ''}><summary>${t('filed', { n: bought.length })}</summary>` +
      bought.map(u => `<div class="filed-row">${u.emoji} ${esc(uName(u))}<br><span class="mono">✓ ${esc(effectText(u))}</span></div>`).join('') + '</details>' : '';
    const det = $('upgFiled').querySelector('details');
    if (det) det.addEventListener('toggle', () => { filedOpen = det.open; });
  }
  const badge = $('upgBadge');
  badge.hidden = affordable === 0; badge.textContent = affordable;
}

/* ---------- Реорганизация ---------- */
function renderRestructure(m) {
  const gain = seniorityGain(S);
  $('rDesc').textContent = t('rDesc', { bonus: Math.round(m.senPer * 100) });
  $('rSen').textContent = fmt(S.seniority);
  $('rBonus').textContent = '+' + Math.round(S.seniority * m.senPer * 100) + '%';
  $('rRun').textContent = fmt(S.runEarned);
  $('rAll').textContent = fmt(S.allTimeEarned);
  $('rNext').textContent = fmt(nextSeniorityAt(S));
  $('rGain').textContent = '+' + fmt(gain) + ' 🎖️';
  const p = Math.min(1, S.runEarned / CONFIG.prestige.minRunEarned);
  $('rProg').style.width = (p * 100) + '%';
  $('rProgText').textContent = t('rProg', { a: fmt(S.runEarned), b: fmt(CONFIG.prestige.minRunEarned) });
  const can = canRestructure(S);
  $('rBtn').disabled = !can;
  $('rBtn').firstElementChild.textContent = can ? t('rFile') : (p < 1 ? t('rInsufficient') : t('rAwaiting'));
  $('rCount').textContent = S.restructures;
  $('rCap').textContent = m.capHours + t('tH');
  $('rEff').textContent = pct(m.eff);
  $('rOwned').textContent = totalOwned(S);
}

/* ---------- Главная отрисовка ---------- */
function render() {
  const m = getMods(S);
  const rate = totalRate(S, m), sRate = stampRate(S, m);
  curRate = rate; curSRate = sRate;   // для плавного счётчика в шапке
  $('rate').textContent = '+' + fmtRate(rate) + ' ' + t('perSec');
  $('stampsLine').hidden = !m.stampsOn;
  if (m.stampsOn) { $('stampRate').textContent = '+' + fmtRate(sRate) + t('perS'); }
  $('senLine').hidden = S.seniority <= 0;
  if (S.seniority > 0) { $('sen').textContent = fmt(S.seniority); $('senBonus').textContent = '+' + Math.round(S.seniority * m.senPer * 100) + '%'; }
  // Кнопка ручной подписи уходит на второй план после первой покупки
  $('signBtn').classList.toggle('minor', totalOwned(S) > 0);

  // Вкладки
  const locks = { depts: false, upgs: !upgradesUnlocked(S), restr: !restructureUnlocked(S) };
  const icons = { depts: '🗄️', upgs: '📎', restr: '🔄' };
  document.querySelectorAll('.tab').forEach(tb => {
    const id = tb.dataset.id;
    tb.disabled = locks[id];
    tb.querySelector('.t-ico').textContent = locks[id] ? '🔒' : icons[id];
    tb.classList.toggle('active', id === activeTab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + activeTab));

  renderDepts(m, rate);
  renderUpgrades(m, rate, sRate);
  if (activeTab === 'restr') renderRestructure(m);
}

/* ---------- Эффект печати на карточке ---------- */
function stampFx(cardId) {
  if (!S.settings.animations) return;
  const card = $(cardId); if (!card) return;
  const s = document.createElement('div');
  s.className = 'stamp-anim'; s.textContent = t('stampApproved');
  card.appendChild(s); setTimeout(() => s.remove(), 1100);
}

/* ---------- Действия игрока ---------- */
function onSign(btn) {
  const a = CONFIG.manualSignAmount;
  S.docs += a; S.runEarned += a; S.allTimeEarned += a; S.stats.signs++;
  haptic.light(); Sound.play('sign');
  if (S.settings.animations) {
    const f = document.createElement('span');
    f.className = 'float-num'; f.textContent = '+' + a;
    btn.appendChild(f); setTimeout(() => f.remove(), 800);
  }
  render();
}
function onBuyDept(id) {
  const d = DEPT_BY_ID[id], m = getMods(S);
  const n = S.buyMode === 'max' ? maxBuy(S, d, m) : S.buyMode;
  const before = owned(S, id);
  if (!buyDept(S, id, n)) return;
  S.stats.bought += n;
  haptic.light(); Sound.play('stamp');
  stampFx('d-' + id);
  const every = CONFIG.milestones.every;
  if (Math.floor(owned(S, id) / every) > Math.floor(before / every)) {
    toast(t('tMilestone', { name: dName(d), n: Math.floor(owned(S, id) / every) * every, m: CONFIG.milestones.mult }));
    haptic.success(); setTimeout(() => Sound.play('milestone'), 150);
  }
  if (before === 0 && totalOwned(S) === n && id === DEPARTMENTS[0].id) toast(t('tFirstDept'));
  render();
}
function onBuyUpg(id) {
  const u = UPG_BY_ID[id];
  if (!buyUpgrade(S, id)) return;
  haptic.light(); Sound.play('upgrade');
  if (u.effect.type === 'unlockStamps') { toast(t('tStamps')); haptic.success(); }
  else toast(t('tApproved', { name: uName(u) }));
  render(); save();
}
function onRestructure() {
  if (!canRestructure(S)) return;
  const gain = seniorityGain(S), m = getMods(S);
  const total = S.seniority + gain;
  showModal({
    form: t('rcForm'), title: t('rcTitle'), stamp: t('stampBoard'),
    body: `<p>${t('rcGain', { g: fmt(gain) })}</p><p>${t('rcTotal', { t: fmt(total), p: Math.round(total * m.senPer * 100) })}</p>` +
      `<p class="hint" style="font-size:13px">${t('rcWarn')}</p>`,
    buttons: [
      { label: t('rcBtn'), onClick: () => {
          S = restructure(S); ensureSettings(S);
          deptKey = upgKey = filedKey = '';
          activeTab = 'depts';
          haptic.success(); Sound.play('shredder');
          toast(t('tRestructured', { n: fmt(S.seniority) }));
          save(); render();
        } },
      { label: t('cancel'), ghost: true },
    ],
  });
}
function onReset() {
  showModal({
    form: t('resetForm'), title: t('resetTitle'), stamp: t('stampVoid'), body: `<p>${t('resetBody')}</p>`,
    buttons: [
      { label: t('resetBtn'), danger: true, onClick: () => {
          const keep = Object.assign({}, S.settings);   // настройки переживают сброс
          Store.wipe(); S = ensureSettings(freshState()); S.settings = keep;
          deptKey = upgKey = filedKey = ''; activeTab = 'depts';
          Sound.play('shredder');
          save(); render(); showIntro();
        } },
      { label: t('cancel'), ghost: true, onClick: showSettings },
    ],
  });
}
function showIntro() {
  showModal({ form: t('introForm'), title: '🗂️ ' + t('introTitle'), stamp: t('stampHired'),
    body: tlist('intro').map(p => `<p>${p}</p>`).join(''),
    buttons: [{ label: t('introBtn'), onClick: () => Sound.play('stamp') }] });
}

// Один обработчик кликов на всё (делегирование)
document.addEventListener('click', e => {
  const tEl = e.target.closest('[data-act]');
  if (!tEl || tEl.disabled) return;
  const id = tEl.dataset.id;
  switch (tEl.dataset.act) {
    case 'sign': onSign(tEl); break;
    case 'buyDept': onBuyDept(id); break;
    case 'buyUpg': onBuyUpg(id); break;
    case 'tab': if (activeTab !== id) Sound.play('tab'); activeTab = id; window.scrollTo({ top: 0 }); render(); break;
    case 'mode': S.buyMode = id === 'max' ? 'max' : +id; haptic.light(); Sound.play('click'); render(); break;
    case 'restructure': onRestructure(); break;
    case 'settings': Sound.play('click'); showSettings(); break;
  }
});
$('overlay').addEventListener('click', e => {
  if (e.target === $('overlay')) { const wasSettings = modalKind === 'settings'; closeModal(); if (wasSettings) save(); }
});
// Звук разблокируется первым касанием
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });

/* ---------- Плавный счётчик в шапке ----------
   Каждый кадр показываем «живое» значение: сохранённое + доход с последнего тика.
   Траты и крупные начисления (офлайн, импорт) докручиваются за доли секунды. */
let curRate = 0, curSRate = 0;
const shown = { docs: null, stamps: null };
let lastFrame = 0;
function easeTo(cur, target, rate, dt) {
  if (cur == null || !S.settings.animations) return target;
  const diff = target - cur;
  if (diff >= 0 && diff <= rate * 0.6 + 1e-9) return target;          // обычный рост — сразу
  if (Math.abs(diff) <= Math.abs(target) * 1e-5) return target;        // практически совпало
  return cur + diff * Math.min(1, dt * 9);                              // трата или крупное начисление — докрутка
}
function frame(now) {
  if (S && !document.hidden) {
    const dt = Math.min(0.1, (now - (lastFrame || now)) / 1000);
    const since = Math.min(0.5, Math.max(0, (Date.now() - lastTick) / 1000));
    shown.docs = easeTo(shown.docs, S.docs + curRate * since, curRate, dt);
    $('docs').textContent = fmtPrecise(shown.docs);
    if (curSRate > 0 || S.stamps > 0) {
      shown.stamps = easeTo(shown.stamps, S.stamps + curSRate * since, curSRate, dt);
      $('stamps').textContent = fmtPrecise(shown.stamps);
    }
  }
  lastFrame = now;
  requestAnimationFrame(frame);
}

/* ---------- Сохранение ---------- */
function save() { if (!S) return; S.lastSeen = Date.now(); Store.save(S); }

/* ---------- Игровой цикл ---------- */
function tick() {
  if (!S || document.hidden) return;   // в фоне не считаем: при возврате сработает офлайн-логика
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt <= 0) return;
  if (dt >= CONFIG.offline.minAwaySec) applyAway(dt);
  else { advance(S, dt, 1); S.stats.playSec += dt; }
  S.lastSeen = now;
  checkUnlocks(false);
  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    Sound.syncAmbience();
    if (Sound.ctx && Sound.ctx.state === 'running') Sound.ctx.suspend();
  } else {
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume().then(() => Sound.syncAmbience(), () => {});
    tick();
  }
});
window.addEventListener('pagehide', save);

/* ---------- Ротация служебных записок ---------- */
function rotateMemo() {
  if (!S || !S.settings.memos) return;
  const el = $('memo');
  el.classList.add('fade');
  setTimeout(() => { el.textContent = pick(tlist('memos')); el.classList.remove('fade'); }, 400);
}

/* ---------- Старт ---------- */
(async function start() {
  const saved = migrate(await Store.load());
  if (saved) {
    S = saved;
    LANG = S.settings.lang; NUMFMT = S.settings.numFormat;
    applySettings();
    const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
    if (away >= CONFIG.offline.minAwaySec) applyAway(away);
    else if (away > 0) advance(S, away, 1);
    checkUnlocks(true);
  } else {
    S = ensureSettings(freshState());
    LANG = S.settings.lang;
    applySettings();
    showIntro();
  }
  $('memo').textContent = pick(tlist('memos'));
  lastTick = Date.now();
  S.lastSeen = lastTick;
  render();
  setInterval(tick, CONFIG.tickMs);
  requestAnimationFrame(frame);
  setInterval(save, CONFIG.saveIntervalMs);
  setInterval(rotateMemo, 15000);
})();
</script>
</body>
