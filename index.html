<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paperwork Inc.</title>
<!--
  ЗАГРУЗЧИК. Сама игра лежит в game.html.
  Встроенный браузер Telegram любит показывать старую копию страницы из кэша.
  Поэтому загрузчик при каждом открытии спрашивает у сервера, не изменился ли
  game.html (запрос без кэша), и открывает его по адресу с «отпечатком» версии:
  новая версия = новый адрес = гарантированно свежая игра.
  Этот файл менять не нужно — обновляется только game.html.
-->
<style>
  html,body{margin:0;height:100%;background:#d9ded3}
  @media (prefers-color-scheme: dark){html,body{background:#181b19}}
</style>
</head>
<body>
<script>
(function () {
  var GAME = 'game.html';
  var done = false;
  function go(build) {
    if (done) return; done = true;
    // сохраняем параметры и #хеш: в хеше Telegram передаёт данные запуска
    var q = location.search.replace(/^\?/, '');
    q = q.replace(/(^|&)build=[^&]*/g, '').replace(/^&/, '');
    if (build) q += (q ? '&' : '') + 'build=' + build;
    location.replace(GAME + (q ? '?' + q : '') + location.hash);
  }
  setTimeout(function () { go(''); }, 4000);   // сеть тупит — открываем как есть
  try {
    fetch(GAME, { cache: 'no-cache' }).then(function (r) {
      var tag = r.headers.get('etag') || r.headers.get('last-modified') || '';
      go(tag.replace(/[^0-9a-zA-Z]/g, '').slice(-16));
    }, function () { go(''); });
  } catch (e) { go(''); }
})();
</script>
<noscript><a href="game.html">Paperwork Inc.</a></noscript>
</body>
</html>
