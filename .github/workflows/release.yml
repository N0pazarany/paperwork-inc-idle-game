# Релиз на GitHub для каждой метки версии (v1.12.2 и т. п.).
# Текст релиза берётся из CHANGELOG.md (ветка main): раздел этой версии на русском и английском.
name: Release from changelog

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Метка версии, например v1.12.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Notes from CHANGELOG.md
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git show origin/main:CHANGELOG.md > CHANGELOG_main.md
          python3 - <<'EOF'
          import os, re, sys
          tag = os.environ['TAG']; v = tag.lstrip('v')
          s = open('CHANGELOG_main.md', encoding='utf-8').read()
          ru, en = s.split('<a id="english"></a>')
          def section(t):
              m = re.search(r'^## ' + re.escape(v) + r'(?:\s[^\n]*)?\n(.*?)(?=^## |^---|\Z)', t, re.S | re.M)
              return m.group(1).strip() if m else None
          r, e = section(ru), section(en)
          if not r or not e:
              sys.exit(f'No changelog section for {v}')
          open('notes.md', 'w', encoding='utf-8').write(f'🇷🇺\n\n{r}\n\n---\n\n🇬🇧\n\n{e}\n')
          EOF
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          # «Последним» помечаем только самую новую версию
          NEWEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          LATEST=false; [ "$TAG" = "$NEWEST" ] && LATEST=true
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest=$LATEST
